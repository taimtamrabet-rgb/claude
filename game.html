<style>
  :root {
    --ink: #1B2A4A; --paper: #F1EBD9; --gold: #B08B4F; --stamp: #A63A34; --teal: #3D6B65;
    --border: #d9cfb4; --divider: #e3d9bc; --muted: #5b5340; --muted2: #4a4432;
    --faded: #c9c1a6; --locked: #9a9a8a; --hilite: #fff8e8; --font: Georgia, 'Times New Roman', serif;
  }
  :root[data-ui-theme="playful"] {
    --ink: #37325A; --paper: #FBF3EA; --gold: #F2A93C; --stamp: #8467E0; --teal: #34B8A6;
    --border: #ECDCCB; --divider: #F3E6D8; --muted: #8D86A3; --muted2: #6C6488;
    --faded: #DCD2EC; --locked: #C6BEDA; --hilite: #FCEEDD;
    --hue-job: #8467E0; --hue-love: #F2668B; --hue-activity: #34B8A6;
    --hue-money: #F2A93C; --hue-shop: #4C9FE0; --hue-keys: #4CBB7A;
    --hue-health: #EE6F62; --hue-look: #F2668B; --hue-smarts: #4C9FE0; --hue-happy: #F2A93C;
    --font: 'Trebuchet MS', 'Segoe UI Rounded', 'Nunito', Verdana, sans-serif;
  }
  * { box-sizing: border-box; }
  /* ---- playful theme: rounder, bouncier shapes ---- */
  [data-ui-theme="playful"] .frame { border-width: 0; border-radius: 28px; box-shadow: 0 14px 0 rgba(45,42,69,.08), 0 24px 55px rgba(123,77,255,.28); }
  [data-ui-theme="playful"] .topbar { background: var(--stamp); border-radius: 28px 28px 0 0; }
  [data-ui-theme="playful"] .eyebrow { color: rgba(255,255,255,.75); }
  [data-ui-theme="playful"] .topbar .sub { color: rgba(255,255,255,.75); }
  [data-ui-theme="playful"] button.tile { border-radius: 18px; border-width: 2px; transition: transform .12s ease; }
  [data-ui-theme="playful"] button.tile:active { transform: scale(.96); }
  [data-ui-theme="playful"] button.tile .icon { border-radius: 12px; }
  [data-ui-theme="playful"] .btn-primary { border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s ease; }
  [data-ui-theme="playful"] .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  [data-ui-theme="playful"] .btn-line { border-radius: 14px; border-width: 2px; font-weight: 700; }
  [data-ui-theme="playful"] .btn-chip { border-radius: 999px; border-width: 2px; font-weight: 700; }
  [data-ui-theme="playful"] .round-btn { border-radius: 999px; border-width: 2px; }
  [data-ui-theme="playful"] .stamp-badge { transform: rotate(0deg); border-radius: 999px; border-width: 2px; }
  [data-ui-theme="playful"] .overlay-card { border-radius: 24px; border-width: 0; box-shadow: 0 20px 60px rgba(45,42,69,.4); }
  [data-ui-theme="playful"] .overlay-close { border-radius: 999px; border-width: 2px; }
  [data-ui-theme="playful"] .row-item .ricon { border-radius: 10px; }
  [data-ui-theme="playful"] .propcard { border-radius: 16px; border-width: 2px; }
  [data-ui-theme="playful"] .statbar-fill, [data-ui-theme="playful"] .perf-fill { border-radius: 999px; }
  [data-ui-theme="playful"] .tile-occupation .icon { background: var(--hue-job); }
  [data-ui-theme="playful"] .tile-relationships .icon { background: var(--hue-love); }
  [data-ui-theme="playful"] .tile-activities .icon { background: var(--hue-activity); }
  [data-ui-theme="playful"] .tile-assets .icon { background: var(--hue-money); }
  [data-ui-theme="playful"] .tile-shopping .icon { background: var(--hue-shop); }
  [data-ui-theme="playful"] .tile-licenses .icon { background: var(--hue-keys); }
  [data-ui-theme="playful"] .stat-health .statbar-fill { background: var(--hue-health); }
  [data-ui-theme="playful"] .stat-look .statbar-fill { background: var(--hue-look); }
  [data-ui-theme="playful"] .stat-smarts .statbar-fill { background: var(--hue-smarts); }
  [data-ui-theme="playful"] .stat-happiness .statbar-fill { background: var(--hue-happy); }
  @media (prefers-reduced-motion: reduce) {
    [data-ui-theme="playful"] button.tile, [data-ui-theme="playful"] .btn-primary { transition: none; }
  }
  body { margin: 0; min-height: 100vh; background: var(--ink); font-family: var(--font); }
  a.back-link { color: var(--muted); font-size: .8rem; text-decoration: none; }
  .center-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .frame { width: 100%; max-width: 720px; border-radius: 14px; overflow: hidden; border: 4px solid var(--gold);
    background: var(--paper); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .topbar { background: var(--ink); padding: 18px 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .3em; font-size: 10px; color: var(--gold); margin: 0; }
  .topbar h1 { color: var(--paper); font-size: 1.4rem; margin: 4px 0 2px; }
  .topbar .sub { color: var(--faded); font-size: 11px; background: none; border: none; cursor: pointer; padding: 0; text-align: left; }
  .topbar .cash { color: var(--paper); font-weight: 700; font-size: 1.05rem; text-align: right; }
  .topbar .agev { color: var(--gold); font-size: 10px; text-transform: uppercase; letter-spacing: .2em; text-align: right; margin-top: 4px; }
  .content { padding: 22px 24px 26px; }
  .statbars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .statbar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .statbar-row .lbl { width: 84px; flex-shrink: 0; color: var(--ink); }
  .statbar-track { flex: 1; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .statbar-fill { height: 100%; border-radius: 999px; background: var(--gold); }
  .statbar-row .val { width: 20px; text-align: right; color: var(--ink); }
  .perf-row { margin-bottom: 8px; }
  .perf-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .perf-track { height: 7px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .perf-fill { height: 100%; border-radius: 999px; background: var(--stamp); }
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  button.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; cursor: pointer; font: inherit; }
  button.tile .icon { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: var(--teal); font-size: 16px; }
  button.tile.accent .icon { background: var(--stamp); }
  button.tile .tlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
  .btn-primary { width: 100%; padding: 13px; border: none; border-radius: 8px; background: var(--stamp); color: var(--paper);
    font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; }
  .btn-line { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--teal);
    background: transparent; color: var(--teal); font-size: 14px; margin-bottom: 8px; }
  .btn-line:disabled { opacity: .5; cursor: not-allowed; }

function formatMoney(usdAmount, country) {
  const cur = CURRENCY[country] || CURRENCY["United States"];
  const local = Math.max(0, usdAmount) * cur.rate;
  return `${cur.symbol}${Math.round(local).toLocaleString()}`;
}
function netOfTax(amount, country) {
  const rate = TAX_RATE[country] != null ? TAX_RATE[country] : 0.25;
  return Math.round(amount * (1 - rate));
}
function effectiveGradingSystem(country, curriculum) {
  const sys = COUNTRIES[country].gradingSystem;
  if (sys === "switchable") return curriculum === "gpa" ? "gpa" : "ib";
  return sys;
}
function convertGrade(raw, system) {
  const r = Math.max(0, Math.min(100, raw));
  switch (system) {
    case "gpa": return (r / 100 * 4).toFixed(2) + " GPA";
    case "twenty": return (r / 100 * 20).toFixed(1) + "/20";
    case "german": return (6 - r / 100 * 5).toFixed(1) + " (DE, 1 best)";
    case "ib": return Math.round(1 + r / 100 * 6) + "/7 IB";
    case "letter": { if (r >= 90) return "A*"; if (r >= 80) return "A"; if (r >= 70) return "B"; if (r >= 60) return "C"; if (r >= 50) return "D"; return "U"; }
    default: return Math.round(r) + "%";
  }
}
function sportsForCountry(country) {

}

const round1 = (v) => Math.round(Math.max(0, v) * 10) / 10;
const round2 = (v) => Math.round(Math.max(0, v) * 100) / 100;
const round3 = (v) => Math.round(Math.max(0, v) * 1000) / 1000;
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function computeSeasonRecord(sport, perf) {
  const meta = SPORT_META[sport];
  const winPct = clamp01(0.28 + (perf - 50) / 140 + (Math.random() * 0.12 - 0.06));
  const wins = Math.round(meta.games * winPct);
  const losses = meta.games - wins;
  const finish = Math.max(1, Math.min(meta.leagueSize, Math.round(1 + (1 - winPct) * (meta.leagueSize - 1))));
  let status;
  if (finish === 1) status = Math.random() < 0.55 ? "League Champions" : "Runner-Up";
  else if (finish <= Math.ceil(meta.leagueSize / 3)) status = "Playoff Appearance";
  else if (finish <= Math.ceil((meta.leagueSize * 2) / 3)) status = "Just Missed Playoffs";
  else status = "Missed Playoffs";
  return { games: meta.games, leagueSize: meta.leagueSize, wins, losses, finish, status };
}

function generateSeasonStats(sport, position, perf) {
  const base = clamp01(perf / 100);
  if (sport === "Basketball") {
    const emphasis = {
      "Point Guard": { pts: 0.75, reb: 0.5, ast: 1.7, stl: 1.3, blk: 0.3 },
      "Shooting Guard": { pts: 1.3, reb: 0.6, ast: 0.8, stl: 1.0, blk: 0.3 },
      "Small Forward": { pts: 1.1, reb: 0.9, ast: 0.9, stl: 1.0, blk: 0.5 },
      "Power Forward": { pts: 1.0, reb: 1.3, ast: 0.6, stl: 0.7, blk: 1.0 },
      "Center": { pts: 0.85, reb: 1.6, ast: 0.4, stl: 0.5, blk: 1.7 },
    }[position];
    return {
      "Points per Game": round1(6 + base * 24 * emphasis.pts),
      "Rebounds per Game": round1(2 + base * 10 * emphasis.reb),
      "Assists per Game": round1(1 + base * 9 * emphasis.ast),
      "Steals per Game": round1(0.4 + base * 2.2 * emphasis.stl),
      "Blocks per Game": round1(0.2 + base * 2.4 * emphasis.blk),
    };
  }
  if (sport === "American Football") {
    if (position === "Quarterback") return {
      "Passing Yards/Game": round1(180 + base * 140),
      "Passing TDs/Game": round1(0.8 + base * 1.6),
      "Completion %": round1(55 + base * 15),
      "Interceptions/Game": round1(Math.max(0.2, 1.2 - base * 0.8)),
    };
    if (position === "Running Back") return {
      "Rushing Yards/Game": round1(35 + base * 65),
      "Rushing TDs/Game": round1(0.3 + base * 0.7),
      "Yards per Carry": round1(3.5 + base * 2.2),
    };
    if (position === "Wide Receiver" || position === "Tight End") return {
      "Receptions/Game": round1(2.5 + base * 4.5),
      "Receiving Yards/Game": round1(35 + base * 70),
      "Receiving TDs/Game": round1(0.2 + base * 0.6),
    };
    if (position === "Kicker") return {
      "Field Goals Made/Game": round1(1.0 + base * 1.2),
      "Field Goal %": round1(70 + base * 22),
    };
    return {
      "Tackles/Game": round1(3 + base * 6),
      "Sacks/Game": round1(0.1 + base * 0.9),
      "Interceptions/Game": round1(0.05 + base * 0.3),
    };
  }
  // Baseball
  if (position === "Pitcher") return {
    "ERA": round2(Math.max(1.8, 5.2 - base * 3.0)),
    "Strikeouts (season)": Math.round(90 + base * 140),
    "Wins": Math.round(4 + base * 14),
    "WHIP": round2(Math.max(0.85, 1.55 - base * 0.55)),
  };
  return {
    "Batting Average": round3(0.22 + base * 0.1),
    "Home Runs (season)": Math.round(4 + base * 32),
    "RBIs (season)": Math.round(25 + base * 80),
    "Stolen Bases (season)": Math.round(base * 22),
  };
}

function rollSeasonAward(c, sport, record, position) {
  const perf = c.jobPerformance || 50;
  const candidates = [];
  if (c.proSeasonNumber === 1 && perf >= 55 && Math.random() < 0.4) candidates.push("Rookie of the Year");
  if (record.status === "League Champions" && Math.random() < 0.35) candidates.push("Finals MVP");

  if (perf >= 75 && (sport !== "American Football" || FOOTBALL_DEFENSE_POSITIONS.includes(position)) && Math.random() < 0.2) candidates.push("Defensive Player of the Year");
  return candidates.length ? randChoice(candidates) : null;
}

function jobRequiresHigherEd(job, ctx) {

const JOB_MARKET_COMPANIES = [
  "Meridian Capital", "Sterling & Co.", "Horizon Group", "Vantage Partners", "Crestview Advisors",
  "Anchor Industries", "Blackwood Associates", "Silverline Holdings", "Bridgeway Partners", "Northgate Corp",
  "Fieldstone Group", "Ashford & Reed", "Lumen Partners", "Cobalt Ventures", "Ridgeline Co.",
  "Ironwood Group", "Pinnacle Partners", "Harborview Industries", "Delacroix & Sons", "Windermere Holdings",
];

function buildJobMarket(ctx) {
  const eligible = ctx.degree && DEGREE_QUALIFIES[ctx.degree] ? DEGREE_QUALIFIES[ctx.degree] : null;
  let pool = eligible || NO_DEGREE_JOBS;
  pool = pool.filter((j) => !jobRequiresHigherEd(j, ctx));
  if (!pool.length) pool = NO_DEGREE_JOBS;
  const postings = [];
  const usedCombos = new Set();
  const pickCompany = (jobBase, tier) => {
    let company, key, attempts = 0;
    do {
      company = randChoice(JOB_MARKET_COMPANIES);
      key = `${jobBase}|${tier}|${company}`;
      attempts++;
    } while (usedCombos.has(key) && attempts < 10);
    usedCombos.add(key);
    return company;
  };
  const cycle = (arr) => { const out = []; while (out.length < 20) out.push(...[...arr].sort(() => Math.random() - 0.5)); return out; };
  const primary = cycle(pool);
  let i = 0;
  while (postings.length < 16 && i < primary.length) { postings.push({ jobBase: primary[i], tier: 0, offTrack: false, company: pickCompany(primary[i], 0) }); i++; }
  if (ctx.smarts >= 7) {
    pool.forEach((j) => { const track = JOB_TRACKS[j]; if (track && track.length > 1 && postings.length < 20 && !tierBlockedByHigherEd(j, 1, ctx)) postings.push({ jobBase: j, tier: 1, offTrack: false, company: pickCompany(j, 1) }); });
  }
  while (postings.length < 20) { const jb = primary[postings.length % primary.length]; postings.push({ jobBase: jb, tier: 0, offTrack: false, company: pickCompany(jb, 0) }); }
  return postings.slice(0, 20);
}

function passChanceFor(ctx, totalScore, posting) {
  let chance = 0.4 + totalScore * 0.06 + (ctx.smarts - 5) * 0.02 + (ctx.look - 5) * 0.01;
  if (posting.tier >= 1) chance -= 0.2;
  if ((ctx.jobPerformance || 50) >= 65) chance += 0.05;
  return Math.min(0.95, Math.max(0.05, chance));
}

function deathChance(age, health) {
  if (age < 60) return Math.max(0, (age - 45)) * 0.0015 + (10 - health) * 0.002;
  return (age - 60) * 0.02 + (10 - health) * 0.01;
}

/* ---- draft (round + team result, supports early declare) ---- */
function marchMadnessBonus(run) {
  const idx = MARCH_MADNESS_ROUNDS.indexOf(run);
  return idx < 0 ? 0 : (idx + 1) * 3;
}
function computeDraftScore(c, sport) {
  let score = c.athleticism * 5 + (c.sportPerformance || 30) * 0.25 + (c.schoolPerformance || 15) * 0.25;
  if (c.marchMadnessRun) score += marchMadnessBonus(c.marchMadnessRun);
  return Math.max(5, Math.min(100, score));
}
function openDraft(sport, early) {
  const c = ctx;
  const score = computeDraftScore(c, sport);
  let passChance = 0.15 + score / 140;
  if (early) passChance -= 0.12;
  passChance = clamp01(Math.max(0.05, Math.min(0.9, passChance)));
  const passed = Math.random() < passChance;
  if (!passed) { activeFlow = { type: "draft", sport, passed: false, early }; render(); return; }
  const maxRounds = DRAFT_ROUNDS[sport];
  const percentile = score / 100;
  let round = Math.round(maxRounds - percentile * (maxRounds - 1));
  round = Math.max(1, Math.min(maxRounds, round + (Math.random() < 0.5 ? 0 : 1)));
  if (early) round = Math.min(maxRounds, round + 1);
  const pick = randInt(1, 32);
  const team = randChoice(TEAM_POOLS[sport]);
  const track = PRO_TRACKS[sport];
  const roundMult = Math.max(0.35, 1.5 - (round - 1) * (1.1 / maxRounds));
  const salary = Math.round(track[0].salary * roundMult * (0.9 + Math.random() * 0.2));
  activeFlow = { type: "draft", sport, passed: true, round, pick, team, salary, early };
  render();
}
function acceptDraft() {
  const c = ctx; const f = activeFlow;
  const track = PRO_TRACKS[f.sport];
  c.proSport = f.sport; c.jobBase = f.sport; c.jobTier = 0; c.job = track[0].title; c.salary = f.salary; c.jobPerformance = 55;
  c.proTeam = f.team; c.proPosition = randChoice(SPORT_META[f.sport].positions); c.proSeasonNumber = 0;
  c.log(`Drafted in Round ${f.round}, Pick ${f.pick} by the ${f.team} (${track[0].title}) — ${formatMoney(f.salary, c.country)}/yr.`);
  activeFlow = null;
  render();
}

function openJobMarket() { activeFlow = { type: "career", step: "select-job", postings: buildJobMarket(ctx) }; render(); }
function chooseJobForFlow(index) {

}
function answerRound1(optIndex) {
  const opt = activeFlow.q1.options[optIndex];
  const remaining = QUESTION_BANK.filter((q) => q !== activeFlow.q1);
  const shuffled = [...remaining].sort(() => Math.random() - 0.5);
  activeFlow = { ...activeFlow, score1: opt.score, step: "round2a", q2a: shuffled[0], q2b: shuffled[1] };
  render();
}
function answerRound2a(optIndex) {
  const opt = activeFlow.q2a.options[optIndex];
  activeFlow = { ...activeFlow, score2a: opt.score, step: "round2b" };
  render();
}
function answerRound2b(optIndex) {
  const c = ctx;
  const opt = activeFlow.q2b.options[optIndex];
  const totalScore = activeFlow.score1 + activeFlow.score2a + opt.score;
  const chance = passChanceFor(c, totalScore, activeFlow.posting);
  const passed = Math.random() < chance;
  let salary = 0;
  if (passed) {
    const bias = COUNTRIES[c.country].cities[c.city].bias;
    const track = JOB_TRACKS[activeFlow.posting.jobBase] || [{ title: activeFlow.posting.jobBase, salary: 45000 }];
    const base = track[activeFlow.posting.tier].salary;
    const rawCityMult = bias[activeFlow.posting.jobBase] || 1;
    const cityMult = 1 + (rawCityMult - 1) * 0.4;
    const variance = 0.95 + Math.random() * 0.1;
    const smartsMult = 1 + (c.smarts - 5) * 0.015;
    salary = Math.round(base * cityMult * variance * smartsMult);
  }
  activeFlow = { ...activeFlow, score2b: opt.score, totalScore, passed, salary, step: "result" };
  render();
}

}

/* ---- age / time advance ---- */
function doYearAdvance() {
  const c = ctx;
  const nextAge = age + 1;
  if (c.job && c.salary && !c.retired) c.wealth += netOfTax(c.salary, c.country);
  if (c.housing) c.wealth -= c.housing.monthly * 12;
  if (c.realEstate && c.realEstate.mortgage && c.realEstate.remainingMonths > 0) {
    c.wealth -= c.realEstate.monthlyPayment * 12;
    c.realEstate.remainingMonths = Math.max(0, c.realEstate.remainingMonths - 12);
  }
  if (c.path === "college" && c.madeTeam === "American Football" && !c.job) c.collegeFootballYears = Math.min(4, c.collegeFootballYears + 1);
  if (c.job) c.yearsWorked = (c.yearsWorked || 0) + 1;

  if (c.madeTeam && c.trainUsesThisYear === 0 && c.tournamentUsesThisYear === 0) c.sportPerformance = clamp100(c.sportPerformance - 3);
  if (c.job && c.workHardUsesThisYear === 0) c.jobPerformance = clamp100(c.jobPerformance - 3);

  c.studyUsesThisYear = 0; c.trainUsesThisYear = 0; c.partTimeUsesThisYear = 0;
  c.tournamentUsesThisYear = 0; c.marchMadnessUsesThisYear = 0; c.workHardUsesThisYear = 0; c.promotionUsesThisYear = 0;
  c.pilot.lessonsThisYear = 0;
  c.log(rollNews(c));

  if (Math.random() < deathChance(nextAge, c.health)) {
    c.age = nextAge; age = nextAge;
    endResult = { ...c, age: nextAge, log: c.logEntries };
    screen = "end";
    render();
    return;
  }
  age = nextAge;
  updateRankings();

  if (c.higherEdInProgress && age >= c.higherEdGradAge) {
    const p = HIGHER_ED_PROGRAMS[c.higherEdInProgress];
    c.higherEd = c.higherEdInProgress;
    c.higherEdInProgress = null;
    c.log(`Completed ${p.label}!`);
  }

  if (c.job && c.proSport && !c.retired) {
    c.proSeasonNumber = (c.proSeasonNumber || 0) + 1;
    const record = computeSeasonRecord(c.proSport, c.jobPerformance || 50);
    const stats = generateSeasonStats(c.proSport, c.proPosition, c.jobPerformance || 50);
    const award = rollSeasonAward(c, c.proSport, record, c.proPosition);
    if (award) c.trophies.push(`${award} — Season ${c.proSeasonNumber} (age ${age})`);
    c.log(`Finished Season ${c.proSeasonNumber} with the ${c.proTeam}: ${record.wins}-${record.losses}, ${record.status}.`);
    activeFlow = { type: "seasonrecap", sport: c.proSport, record, stats, award, season: c.proSeasonNumber, position: c.proPosition, team: c.proTeam };
    render();
    return;
  }

  if (c.path === "college" && age === 22 && !c.gradNotified) {
    c.gradNotified = true; c.uniGraduated = true;
    activeFlow = { type: "graduation" };
    render();
    return;
  }
  rollEvent(age);
}
function continueAfterGraduation() { activeFlow = null; rollEvent(age); }
function continueAfterSeasonRecap() {
  activeFlow = null;
  const c = ctx;
  if (c.path === "college" && age === 22 && !c.gradNotified) {
    c.gradNotified = true; c.uniGraduated = true;
    activeFlow = { type: "graduation" };
    render();
    return;
  }
  rollEvent(age);
}

function advanceTime() {
  const c = ctx;
  if (character.ageMode === "monthly") {
    c.month = (c.month || 0) + 1;
    if (c.job && c.salary && !c.retired) c.wealth += netOfTax(c.salary, c.country) / 12;
    if (c.housing) c.wealth -= c.housing.monthly;
    if (c.realEstate && c.realEstate.mortgage && c.realEstate.remainingMonths > 0) {
      c.wealth -= c.realEstate.monthlyPayment;
      c.realEstate.remainingMonths = Math.max(0, c.realEstate.remainingMonths - 1);
    }
    if (Math.random() < 0.3) c.log(rollNews(c));
    if (c.month >= 12) { c.month = 0; doYearAdvance(); }
    else render();
  } else {
    doYearAdvance();
  }
}

function renderDashboardBody() {
  const c = ctx;

  const tiles = [
    { key: "occupation", label: occLabel, sub: occSub, icon: "💼", accent: true },
    { key: "relationships", label: "Relationships", sub: c.relationship || "Single", icon: "❤️" },
    { key: "activities", label: "Activities", sub: `${c.logEntries.length} entries`, icon: "📔" },

    { key: "shopping", label: "Shopping", sub: `${c.pets.length + c.cars.length + (c.realEstate ? 1 : 0)} owned`, icon: "🛍️" },
    { key: "licenses", label: "Licenses", sub: `${(c.carLicense ? 1 : 0) + (c.pilotStudentLicense ? 1 : 0)}/2`, icon: "🔑" },

  return `
    <div class="tile-grid">${tiles.map((t) => `

}

function renderSubPage() {

/* ---- occupation page ---- */
function pageOccupation() {
  const c = ctx;
  const a = age;
  const inSchool = (a < 18 && !c.droppedOutSchool) || (c.path === "college" && a < 22);
  const gradeSystem = effectiveGradingSystem(character.country, c.curriculum);
  let html = `<p class="page-title">Occupation</p>`;

  if (a < 5) {
    return html + `<p class="flavor" style="font-style:normal;">${esc(ageBracketLabel(a))} — too young for school or work. Just growing up.</p>`;
  }

  if (inSchool && !c.job) {
    html += rowHTML("📖", "Grades", convertGrade(c.gradeRaw, gradeSystem));
    html += rowBtnHTML("📖", "Study Harder", c.studyUsesThisYear >= 1 ? "Used for this year" : "Once a year", "openSubject", null, c.studyUsesThisYear >= 1);
    if (a >= 14 && a < 18) html += rowBtnHTML("💼", "Part-Time Job", c.partTimeUsesThisYear >= 2 ? "Used up for this year" : `${2 - c.partTimeUsesThisYear} left this year`, "openPartTime", null, c.partTimeUsesThisYear >= 2);

    if (c.path !== "college" && a >= 11 && a < 18) {
      html += rowBtnHTML("🏫", "Transfer School", `Currently: ${SCHOOL_TYPES[c.schoolType].label}${c.schoolTransferUsesThisYear >= 1 ? " · used for this year" : ""}`, "openSchoolTransfer", null, c.schoolTransferUsesThisYear >= 1);
    }

    if (c.path === "college") {
      if (["Biology", "Health Sciences"].includes(c.degree)) {
        html += c.premed
          ? rowHTML("🩺", "Pre-Med Track", "Declared — on track for medical school")
          : rowBtnHTML("🩺", "Declare Pre-Med Track", "Unlocks an easier path into Medical School", "declarePremed");
      }
    }

    if (a < 11) {
      html += rowHTML("🏀", "Sports Clubs", "Open starting in middle school (age 11)");
    } else if (a < 18) {
      if (c.madeTeam) html += rowHTML("🏀", "Team", `On the ${c.madeTeam} team`);
      else html += rowBtnHTML("🏀", "Try Out for a Team", "Pick a sport", "openTryout");
    }

    if (c.madeTeam) {
      html += `<div class="section-label">School Performance</div>` + perfBarHTML("Program strength", c.schoolPerformance);
      html += `<div class="section-label">My Performance</div>` + perfBarHTML("Personal skill", c.sportPerformance);
      html += rowHTML("🏆", "National Rank", c.nationalRank ? `#${c.nationalRank.toLocaleString()} of ~${NATIONAL_SCHOOL_POOL.toLocaleString()} programs` : "Unranked");
      if (c.path === "college") html += rowHTML("🏆", "Division Rank", c.collegeRank ? `#${c.collegeRank} of ~${COLLEGE_DIVISION_POOL}` : "Unranked");
      html += rowBtnHTML("📈", "Train Harder", c.trainUsesThisYear >= 1 ? "Used for this year" : "Once a year — boosts my performance", "trainHarder", null, c.trainUsesThisYear >= 1);
      if (c.madeTeam === "Basketball" && a < 18) {
        html += rowBtnHTML("🏆", "Enter Tournament", c.tournamentUsesThisYear >= 1 ? "Used for this year" : "Once a year — regional, state, or national", "openTournament", null, c.tournamentUsesThisYear >= 1);
      }
      if (c.madeTeam === "Basketball" && c.path === "college") {
        if (c.collegeRank && c.collegeRank <= 30) html += rowBtnHTML("🏆", "Enter March Madness", c.marchMadnessUsesThisYear >= 1 ? "Used for this year" : "Once a year — top-30 D1 team", "openMarchMadness", null, c.marchMadnessUsesThisYear >= 1);
        else html += rowHTML("🔒", "March Madness", `Requires a top-30 D1 team (currently ${c.collegeRank ? `#${c.collegeRank}` : "unranked"} of ~${COLLEGE_DIVISION_POOL})`);
      }
      if (c.path === "college" && c.madeTeam === "American Football") html += rowHTML("🏈", "College Football", `${c.collegeFootballYears}/4 seasons played`);
      const de = draftEligible(c, a);
      if (de) html += rowBtnHTML("📋", de.early ? "Declare Early for Draft" : "Declare for Draft", "Try to go pro", "declareDraft", de.sport + "|" + (de.early ? "1" : "0"));
      html += rowBtnHTML("🚪", "Quit Team", "Leave the club", "quitTeam");
    }

    if (c.path === "college") {
      html += rowBtnHTML("🚪", "Drop Out of College", "Leave without finishing the degree", "dropOutOfCollege");
    } else if (a >= dropoutAgeFor()) {
      html += rowBtnHTML("🚪", "Drop Out of School", `Legal at age ${dropoutAgeFor()} in ${character.country}`, "dropOutOfSchool");
    }
  }

  if (!inSchool && !c.job) {
    const sport = draftEligible(c, a);
    html += rowHTML("💼", "Unemployed", "No job yet");
    html += rowBtnHTML("💼", "Job Market", "Browse 20 openings", "openJobMarket");
    if (sport) html += rowBtnHTML("📋", sport.early ? `Declare Early for ${sport.sport} Draft` : `Declare for ${sport.sport} Draft`, "Try to go pro", "declareDraft", sport.sport + "|" + (sport.early ? "1" : "0"));
    html += rowBtnHTML("✈️", "Special Careers", "Pilot, pro sports tryouts", "openSpecialCareers");
  }

  if (c.job) {
    html += rowHTML("💼", c.job, `${c.employer ? c.employer + " · " : ""}${formatMoney(c.salary, character.country)}/yr (${formatMoney(netOfTax(c.salary, character.country), character.country)} after tax)`);
    if (c.proSport) {
      html += rowHTML("🎽", "Team", `${c.proTeam} · ${c.proPosition}`);
      html += rowHTML("📅", "Seasons Played", `${c.proSeasonNumber}`);
    }
    html += `<div class="section-label">Job Performance</div>` + perfBarHTML("Performance", c.jobPerformance);
    html += rowBtnHTML("📈", "Work Harder", c.workHardUsesThisYear >= 1 ? "Used for this year" : "Once a year", "workHarder", null, c.workHardUsesThisYear >= 1);
    const track = getTrack(c.jobBase);
    if (track && c.jobTier < track.length - 1) {
      const nextTier = c.jobTier + 1;
      const blocked = tierBlockedByHigherEd(c.jobBase, nextTier, c);
      if (blocked) {
        const req = JOB_TIER_HIGHER_ED[c.jobBase][nextTier];
        html += rowHTML("🔒", `Promotion to ${track[nextTier].title}`, `Requires ${HIGHER_ED_PROGRAMS[req].label}`);
      } else {
        html += rowBtnHTML("🪜", "Request Promotion", c.promotionUsesThisYear >= 1 ? "Used for this year" : `Once a year — aim for ${track[nextTier].title}`, "requestPromotion", null, c.promotionUsesThisYear >= 1);
      }
    }
    html += rowBtnHTML("🚪", "Quit Job", "Leave your current job", "quitJob");
  }

  if (c.uniGraduated) {
    html += `<div class="section-label">Higher Education</div>`;
    if (c.higherEd) html += rowHTML("🎓", HIGHER_ED_PROGRAMS[c.higherEd].label, "Completed");
    if (c.higherEdInProgress) html += rowHTML("🎓", HIGHER_ED_PROGRAMS[c.higherEdInProgress].label, `In progress — graduates age ${c.higherEdGradAge}`);
    if (!c.higherEdInProgress) html += rowBtnHTML("🎓", "Apply to Higher Education", "Medical, Law, Grad, MBA, Vet, Dental, Pharmacy", "openHigherEd");
  }
  return html;
}

function rowHTML(icon, label, value) {
  return `<div class="row-item"><span class="ricon">${icon}</span><div class="rtext"><p class="rlabel">${esc(label)}</p><p class="rval">${esc(value)}</p></div></div>`;
}
function rowBtnHTML(icon, label, value, action, arg, disabled) {
  return `<button class="row-btn" data-action="${action}" ${arg != null ? `data-arg="${esc(arg)}"` : ""} ${disabled ? "disabled" : ""}>
    <div class="row-item"><span class="ricon">${icon}</span><div class="rtext"><p class="rlabel">${esc(label)}</p><p class="rval">${esc(value)}</p></div>${disabled ? "" : '<span style="color:var(--stamp);">›</span>'}</div>
  </button>`;
}

}

/* ============================== FLOW OVERLAY ============================== */
function overlayShell(eyebrow, bodyHTML, closeAction) {
  return `<div class="overlay" id="flowOverlay"><div class="overlay-card">
    ${eyebrow ? `<p class="overlay-eyebrow">${esc(eyebrow)}</p>` : ""}
    ${bodyHTML}
    ${closeAction ? `<button class="overlay-close" data-action="${closeAction}">Close</button>` : ""}
  </div></div>`;
}
function choiceBtn(action, arg, label) {
  return `<button class="btn-line" data-action="${action}" ${arg != null ? `data-arg="${esc(arg)}"` : ""}>${esc(label)}</button>`;
}

function renderFlowOverlay() {
  const existing = document.getElementById("flowOverlay");
  if (existing) existing.remove();
  if (!activeFlow) return;
  const c = ctx;
  const f = activeFlow;
  let html = "";

  if (f.type === "event") {
    html = overlayShell("Age " + age, `<p class="overlay-text">${esc(f.event.text(c))}</p>` + f.event.choices.map((ch, i) => choiceBtn("chooseEvent", i, ch.label)).join(""));
  } else if (f.type === "degree") {
    html = overlayShell("College", `<p class="overlay-text">Which degree will ${esc(c.first)} study?</p><div class="chip-wrap">${DEGREES.map((d) => `<button class="btn-chip" data-action="pickDegree" data-arg="${esc(d)}">${esc(d)}</button>`).join("")}</div>`);
  } else if (f.type === "unitype") {
    html = overlayShell("College", `<p class="overlay-text">Which kind of university will ${esc(c.first)} attend?</p>` +
      choiceBtn("chooseUniType", "state", "State University — affordable, solid degree") +
      choiceBtn("chooseUniType", "ivy", "Ivy League — prestigious, much pricier"));
  } else if (f.type === "funding") {
    let body = `<p class="overlay-text">How will ${esc(c.first)} pay for ${c.uniType === "ivy" ? "Ivy League" : "state university"} tuition?</p>`;
    if (!f.parentsFailed) body += choiceBtn("chooseFunding", "parents", "Ask parents to pay");
    if (c.gradeRaw >= (c.uniType === "ivy" ? 88 : 72)) body += choiceBtn("chooseFunding", "academic", "Academic scholarship (offered for your grades)");
    if (c.athleticism >= 8 || c.madeTeam) body += choiceBtn("chooseFunding", "sports", "Athletic scholarship (offered for your performance)");
    body += choiceBtn("chooseFunding", "loan", `Take a student loan (${formatMoney(c.uniType === "ivy" ? 45000 : 15000, character.country)})`);
    html = overlayShell("College", body);
  } else if (f.type === "subject") {
    if (f.step === "pick") html = overlayShell("Study", `<p class="overlay-text">Which lesson will ${esc(c.first)} study harder for?</p><div class="chip-wrap">${SUBJECTS.map((s) => `<button class="btn-chip" data-action="pickSubject" data-arg="${esc(s)}">${esc(s)}</button>`).join("")}</div>`);
    else html = overlayShell(f.subject + " pop quiz", `<p class="overlay-text">${esc(f.question.q)}</p>` + f.question.options.map((o, i) => choiceBtn("answerSubject", i, o.label)).join(""));
  } else if (f.type === "tryout") {
    if (f.step === "pick") {
      const autoIn = c.talent === "sports" && age < 18;
      html = overlayShell("Tryouts", `<p class="overlay-text">Which team will ${esc(c.first)} try out for?</p>${autoIn ? `<p class="flavor" style="font-style:normal;">Your sports talent means you'll make the team automatically.</p>` : ""}<div class="chip-wrap">${sportsForCountry(character.country).map((s) =>
        `<button class="btn-chip" data-action="chooseSport" data-arg="${esc(s)}">${esc(s)}</button>`
      ).join("")}</div>`);
    } else {
      html = overlayShell("Tryouts", `<p class="overlay-text">${f.passed ? (f.autoIn ? `Your talent got you straight onto the ${esc(f.sport)} team!` : `Made the ${esc(f.sport)} team!`) : `Didn't make the ${esc(f.sport)} team this time.`}</p><button class="btn-primary" data-action="finishTryout">Continue</button>`);
    }
  } else if (f.type === "tournament" && f.step === "pick") {
    const tierRow = (key) => {
      const info = TOURNAMENT_TIERS[key];
      const avail = tournamentTierAvailable(key);
      const reason = info.minRank ? `Requires a top-${info.minRank.toLocaleString()} national rank` : "Always open";
      return rowBtnHTML("🏆", info.label, avail ? reason : `🔒 ${reason} (currently ${c.nationalRank ? `#${c.nationalRank.toLocaleString()}` : "unranked"})`, "pickTournamentTier", key, !avail);
    };
    html = overlayShell("Enter Tournament", `<p class="overlay-text">Which tournament will ${esc(c.first)}'s team enter this year?</p>` + Object.keys(TOURNAMENT_TIERS).map(tierRow).join(""), "closeFlow");
  } else if (f.type === "tournament" || f.type === "marchmadness") {
    const rounds = f.type === "tournament" ? TOURNAMENT_TIERS[f.tier].rounds : MARCH_MADNESS_ROUNDS;
    const label = f.type === "tournament" ? TOURNAMENT_TIERS[f.tier].label : "March Madness";
    if (!f.done) {
      html = overlayShell(label, `<p class="overlay-text">Round: <strong>${esc(rounds[f.roundIndex])}</strong></p><button class="btn-primary" data-action="${f.type === "tournament" ? "playTournamentRound" : "playMarchMadnessRound"}">Play Round</button>`);
    } else {
      html = overlayShell(label, `<p class="overlay-text">${f.champion ? `🏆 Champions! ${esc(c.first)} won it all.` : `The run ended in the ${esc(rounds[f.roundIndex])}.`}</p><button class="btn-primary" data-action="closeFlow">Continue</button>`);
    }
  } else if (f.type === "draft") {
    if (f.passed) {
      html = overlayShell("Draft Result", `<p class="overlay-text">Round ${f.round}, Pick ${f.pick} — drafted by the <strong>${esc(f.team)}</strong>${f.early ? " (early entry)" : ""}.</p>
        <p class="overlay-text">${formatMoney(f.salary, character.country)}/yr (${formatMoney(netOfTax(f.salary, character.country), character.country)} after tax)</p>
        <div class="two-btn" style="display:flex;gap:8px;"><button class="btn-primary" style="flex:1;" data-action="acceptDraft">Accept</button><button class="btn-line" style="flex:1;margin:0;" data-action="declineDraft">Decline</button></div>`);
    } else {
      html = overlayShell("Draft Result", `<p class="overlay-text">${esc(c.first)} went undrafted in ${esc(f.sport)} this time.</p><button class="btn-primary" data-action="closeFlow">Continue</button>`);
    }
  } else if (f.type === "career") {
    if (f.step === "select-job") {
      html = overlayShell("Job Market", `<p class="overlay-text">${c.degree ? `With a degree in ${esc(c.degree)}, which posting will ${esc(c.first)} apply for?` : `Which posting will ${esc(c.first)} apply for?`}</p>` +
        f.postings.map((p, i) => { const track = JOB_TRACKS[p.jobBase]; const title = track[p.tier].title; return choiceBtn("chooseJobForFlow", i, `${title} · ${esc(p.company)}` + (p.tier >= 1 ? " · Senior (harder)" : "")); }).join(""));
    } else if (f.step === "round1") {
      html = overlayShell("Interview · Round 1 of 2", `<p class="overlay-text">${esc(f.q1.q)}</p>` + f.q1.options.map((o, i) => choiceBtn("answerRound1", i, o.label)).join(""));
    } else if (f.step === "round2a") {
      html = overlayShell("Interview · Round 2 (question 1)", `<p class="overlay-text">${esc(f.q2a.q)}</p>` + f.q2a.options.map((o, i) => choiceBtn("answerRound2a", i, o.label)).join(""));
    } else if (f.step === "round2b") {
      html = overlayShell("Interview · Round 2 (question 2)", `<p class="overlay-text">${esc(f.q2b.q)}</p>` + f.q2b.options.map((o, i) => choiceBtn("answerRound2b", i, o.label)).join(""));
    } else {
      html = overlayShell("Interview Result", `<p class="overlay-text">${f.passed ? `Congratulations — ${esc(c.first)} got the job!` : `Unfortunately, ${esc(c.first)} didn't get the offer this time.`}</p>${f.passed ? `<p class="overlay-text">Starting salary: <strong>${formatMoney(f.salary, character.country)}/yr</strong></p>` : ""}<button class="btn-primary" data-action="finishCareerFlow">Continue</button>`);
    }
  } else if (f.type === "parttime") {
    html = overlayShell("Part-Time Job", `<p class="overlay-text">Which part-time job will ${esc(c.first)} take?</p>` + PART_TIME_JOBS.map((j, i) => choiceBtn("choosePartTime", i, `${j.name} — ${formatMoney(j.pay, character.country)}`)).join(""));
  } else if (f.type === "specialcareers") {
    html = overlayShell("Special Careers", `<p class="overlay-text">Which special career will ${esc(c.first)} pursue?</p>` +
      choiceBtn("goToPilot", "", "✈️ Airline Pilot") + choiceBtn("goToSportsRequest", "", "🏆 Pro Sports Tryout Request"), "closeFlow");
  } else if (f.type === "pilot") {
    let body = `<p class="overlay-text">✈️ Pilot Career</p>`;
    if (!c.pilotStudentLicense) body += `<p class="overlay-text">You'll need a Student Pilot License first — get one from Licenses (age 16+).</p>`;
    else if (age < 18) body += `<p class="overlay-text">Pilot school starts at age 18. Come back then.</p>`;
    else {
      body += rowHTML("✈️", "Flight hours logged", `${c.pilot.hours} hrs`);
      body += rowBtnHTML("✈️", "Take a Flight Lesson", `${formatMoney(2500, character.country)} · ${c.pilot.lessonsThisYear >= 2 ? "used up this year" : `${2 - c.pilot.lessonsThisYear} left`}`, "takeFlightLesson", null, c.pilot.lessonsThisYear >= 2);
      body += `<div class="section-label">Licenses</div>`;
      PILOT_LICENSES.forEach((lic, i) => {
        const already = c.pilot.licenseLevel > i;
        const canEnroll = !already && c.pilot.licenseLevel === i && age >= lic.minAge && c.pilot.hours >= lic.hours && c.wealth >= lic.cost;
        body += rowBtnHTML("🎓", lic.label, already ? "Earned" : `Age ${lic.minAge}+ · ${lic.hours} hrs · ${formatMoney(lic.cost, character.country)}`, "enrollLicense", i, !canEnroll);
      });
      if (c.pilot.licenseLevel > 0 && !c.job) {
        body += `<div class="section-label">Airlines Hiring</div>`;
        AIRLINES.filter((a) => c.pilot.licenseLevel >= a.minLicense).forEach((a, i) => { body += rowBtnHTML("✈️", a.name, `Prestige ${a.prestige}`, "applyToAirline", a.name); });
      }
    }
    html = overlayShell(null, body, "closeFlow");
  } else if (f.type === "sportsrequest") {
    if (!f.step) {
      html = overlayShell("Tryout Request", `<p class="overlay-text">Request a tryout with which league?</p>` +
        ["Basketball", "Baseball", "American Football"].map((sport) => {
          const eligible = directSportEligible(sport, c, age);
          const tag = sport === "Basketball" ? "NBA" : sport === "Baseball" ? "MLB" : "NFL";
          return `<button class="btn-line" ${eligible ? `data-action="declareDraft" data-arg="${sport}|0"` : "disabled"}>${tag} Tryout${!eligible ? " (not eligible)" : ""}</button>`;
        }).join(""), "closeFlow");
    }
  } else if (f.type === "schooltransfer") {
    const rows = Object.keys(SCHOOL_TYPES).map((key) => {
      const t = SCHOOL_TYPES[key];
      const current = key === c.schoolType;
      const eligible = t.requirement(c);
      const value = current ? "Current school" : !eligible ? `🔒 Requirements not met` : t.scholarship ? `🎓 Scholarship (free) — ${t.desc}` : t.desc;
      return rowBtnHTML("🏫", t.label, value, "transferSchool", key, current || !eligible);
    }).join("");
    html = overlayShell("Transfer School", `<p class="overlay-text">Where will ${esc(c.first)} go to school?</p>${rows}`, "closeFlow");
  } else if (f.type === "housing") {
    html = overlayShell("Housing", `<p class="overlay-text">Where will ${esc(c.first)} live?</p>` + HOUSING_OPTIONS.map((o, i) => choiceBtn("chooseHousing", i, `${o.label} — ${formatMoney(o.monthly, character.country)}/mo`)).join(""));
  } else if (f.type === "migrate") {
    if (f.step === "country") html = overlayShell("Migrate", `<p class="overlay-text">Where will ${esc(c.first)} migrate to?</p><div class="chip-wrap">${Object.keys(COUNTRIES).map((ctry) => `<button class="btn-chip" data-action="pickMigrateCountry" data-arg="${esc(ctry)}">${esc(ctry)}</button>`).join("")}</div>`);
    else html = overlayShell("Migrate", `<p class="overlay-text">Which city in ${esc(f.country)}?</p><div class="chip-wrap">${Object.keys(COUNTRIES[f.country].cities).map((ct) => `<button class="btn-chip" data-action="pickMigrateCity" data-arg="${esc(ct)}">${esc(ct)}</button>`).join("")}</div>`);
  } else if (f.type === "seasonrecap") {
    const r = f.record;
    let body = `<p class="overlay-text" style="text-align:center;font-weight:700;">🏆 Season ${f.season}</p>
      <p class="overlay-text" style="text-align:center;">You just finished your ${ordinal(f.season)} season as a professional ${esc(f.sport)} player.</p>
      <div class="net-line"><span>Team</span><span>${esc(f.team)}</span></div>
      <div class="net-line"><span>Record</span><span>${r.wins}-${r.losses}</span></div>
      <div class="net-line"><span>League Finish</span><span>${ordinal(r.finish)} out of ${r.leagueSize}</span></div>
      <div class="net-line"><span>Status</span><span>${esc(r.status)}</span></div>
      <div class="net-line"><span>Position</span><span>${esc(f.position)}</span></div>
      <div class="section-label">Season Stats</div>`;
    body += Object.entries(f.stats).map(([label, val]) => `<div class="net-line"><span>${esc(label)}</span><span>${val}</span></div>`).join("");
    body += f.award
      ? `<div class="net-line" style="color:var(--stamp);font-weight:700;"><span>🏅 Award</span><span>${esc(f.award)}</span></div>`
      : `<div class="net-line"><span>Award</span><span>None this season</span></div>`;
    body += `<button class="btn-primary" style="margin-top:14px;" data-action="continueAfterSeasonRecap">Continue</button>`;
    html = overlayShell(null, body);
  } else if (f.type === "highered") {
    const rows = Object.keys(HIGHER_ED_PROGRAMS).map((key) => {
      const p = HIGHER_ED_PROGRAMS[key];
      const eligible = higherEdEligible(c, key);
      const reason = eligible ? `${formatMoney(p.cost, character.country)} · ${p.years} years` : `🔒 ${higherEdLockedReason(c, key)}`;
      return rowBtnHTML("🎓", p.label, reason, "applyHigherEd", key, !eligible);
    }).join("");
    html = overlayShell("Higher Education", `<p class="overlay-text">Which program will ${esc(c.first)} apply to?</p>${rows}`, "closeFlow");
  } else if (f.type === "graduation") {
    html = overlayShell(null, `<p class="overlay-text" style="text-align:center;font-weight:700;color:var(--stamp);">🎓 Congratulations!</p><p class="overlay-text" style="text-align:center;">${esc(c.first)} graduated from college${c.degree ? ` with a degree in ${esc(c.degree)}` : ""}!</p><button class="btn-primary" data-action="continueAfterGraduation">Continue</button>`);
  } else if (f.type === "dating") {
    html = overlayShell("Dating", `<p class="overlay-text">How will ${esc(c.first)} meet someone?</p>` +
      choiceBtn("goOnDate", "0", "Meet someone the old-fashioned way (free)") +
      (age >= 18 ? choiceBtn("goOnDate", "1", `Use a dating app with filters — ${formatMoney(50, character.country)}`) : `<p class="flavor">Dating apps unlock at age 18.</p>`));
  }

  document.body.insertAdjacentHTML("beforeend", html);
}

/* ============================== RENDER: END ============================== */
function renderEndScreen() {
  applyThemeVars(character.uiTheme);
  const r = endResult;
  document.getElementById("root").innerHTML = `
    <div class="frame">
      <div class="topbar" style="display:block;">
        <p class="eyebrow">Bureau of Life Records</p>
        <h1 class="end-title">Final Entry</h1>
      </div>
      <div class="content">
        <p style="color:var(--ink);">${esc(r.first)} ${esc(r.last)} of ${esc(character.city)}, ${esc(character.country)}, passed away peacefully at age ${r.age}${r.job ? `, having spent a career as a ${esc(r.job)}` : ""}.</p>
        <div class="net-line"><span>Final savings</span><span>${formatMoney(r.wealth, character.country)} <span style="font-size:11px;color:var(--muted);">(${CURRENCY[character.country].code})</span></span></div>
        ${r.trophies && r.trophies.length ? `<div class="net-line"><span>Trophies</span><span>${esc(r.trophies.join(", "))}</span></div>` : ""}
        <div class="section-label">Life story</div>
        <div class="diary">${r.log.map((e) => `<p><span class="dage">Age ${e.age}:</span> ${esc(e.msg)}</p>`).join("")}</div>
        <button class="btn-primary" style="margin-top:14px;" data-action="restart">Begin a new life</button>
      </div>
    </div>`;
}

/* ============================== DISPATCH ============================== */
function render() {
  if (screen === "create") renderCreateScreen();
  else if (screen === "end") renderEndScreen();
  else renderGameShell();
  renderFlowOverlay();
  wireCreateInputs();
}

function wireCreateInputs() {
  const f = document.getElementById("firstInput");
  const l = document.getElementById("lastInput");
  if (f) f.addEventListener("input", (e) => { createDraft.first = e.target.value; syncStartButton(); });
  if (l) l.addEventListener("input", (e) => { createDraft.last = e.target.value; syncStartButton(); });
}
function syncStartButton() {
  const btn = document.querySelector('[data-action="startLife"]');
  if (btn) btn.disabled = !(createDraft.first.trim() && createDraft.last.trim());
}

const ACTIONS = {
  setGender: (arg) => { createDraft.gender = arg; render(); },
  setCountry: (arg) => { createDraft.country = arg; createDraft.city = Object.keys(COUNTRIES[arg].cities)[0]; render(); },
  setCity: (arg) => { createDraft.city = arg; render(); },
  setCurriculum: (arg) => { createDraft.curriculum = arg; render(); },
  setTalent: (arg) => { createDraft.talent = arg || null; render(); },
  setAgeMode: (arg) => { createDraft.ageMode = arg; render(); },
  setUiTheme: (arg) => { createDraft.uiTheme = arg; render(); },
  adjustStat: (arg, arg2) => {
    const delta = Number(arg2);
    const cur = createDraft.stats[arg];
    const next = clampStat(cur + delta);
    if (next === cur) return;
    if (delta > 0) { if (createDraft.pool <= 0) return; createDraft.pool -= 1; }
    else createDraft.pool = Math.min(START_POOL, createDraft.pool + 1);
    createDraft.stats[arg] = next;
    render();
  },
  startLife: () => {
    if (!(createDraft.first.trim() && createDraft.last.trim())) return;
    character = { ...createDraft, wealth: 500 };
    ctx = newCtx(character);
    age = 0;
    screen = "dashboard";
    rollEvent(0);
  },
  nav: (arg) => { screen = arg; render(); },
  ageUp: () => advanceTime(),
  cycleGender: () => cycleGender(),
  setShoppingSection: (arg) => { shoppingSection = arg; render(); },

  chooseEvent: (arg) => chooseEventOption(activeFlow.event.choices[Number(arg)]),
  pickDegree: (arg) => pickDegree(arg),
  chooseUniType: (arg) => chooseUniType(arg),
  chooseFunding: (arg) => chooseFunding(arg),

  openSubject: () => openSubjectFlow(),
  pickSubject: (arg) => pickSubject(arg),
  answerSubject: (arg) => answerSubjectQuestion(activeFlow.question.options[Number(arg)]),

  openTryout: () => openTryoutFlow(),
  chooseSport: (arg) => chooseSport(arg),
  finishTryout: () => finishTryout(),
  quitTeam: () => quitTeam(),

  openTournament: () => openTournamentFlow(),
  pickTournamentTier: (arg) => pickTournamentTier(arg),
  playTournamentRound: () => playTournamentRound(),
  openMarchMadness: () => openMarchMadnessFlow(),
  playMarchMadnessRound: () => playMarchMadnessRound(),

  declareDraft: (arg) => { const [sport, early] = arg.split("|"); openDraft(sport, early === "1"); },
  acceptDraft: () => acceptDraft(),
  declineDraft: () => declineDraft(),
  closeFlow: () => { activeFlow = null; render(); },

  openJobMarket: () => openJobMarket(),
  chooseJobForFlow: (arg) => chooseJobForFlow(Number(arg)),
  answerRound1: (arg) => answerRound1(Number(arg)),
  answerRound2a: (arg) => answerRound2a(Number(arg)),
  answerRound2b: (arg) => answerRound2b(Number(arg)),
  finishCareerFlow: () => finishCareerFlow(),

  workHarder: () => workHarder(),
  requestPromotion: () => requestPromotion(),
  trainHarder: () => trainHarder(),
  quitJob: () => quitJob(),
  dropOutOfSchool: () => dropOutOfSchool(),
  dropOutOfCollege: () => dropOutOfCollege(),
  openSchoolTransfer: () => openSchoolTransferFlow(),
  transferSchool: (arg) => transferSchool(arg),

  openPartTime: () => openPartTimeFlow(),
  choosePartTime: (arg) => choosePartTimeJob(PART_TIME_JOBS[Number(arg)]),

  openSpecialCareers: () => openSpecialCareers(),
  goToPilot: () => openPilotFlow(),
  goToSportsRequest: () => openSportsRequest(),
  takeFlightLesson: () => takeFlightLesson(),
  enrollLicense: (arg) => enrollLicense(PILOT_LICENSES[Number(arg)]),
  applyToAirline: (arg) => applyToAirline(AIRLINES.find((a) => a.name === arg)),
  getCarLicense: () => getCarLicense(),
  getPilotStudentLicense: () => getPilotStudentLicense(),

  openHousing: () => openHousingFlow(),
  chooseHousing: (arg) => chooseHousing(HOUSING_OPTIONS[Number(arg)]),
  openMigrate: () => openMigrateFlow(),
  pickMigrateCountry: (arg) => pickMigrateCountry(arg),
  pickMigrateCity: (arg) => pickMigrateCity(arg),

  buyPet: (arg) => buyPet(PETS[Number(arg)]),
  buyCar: (arg) => { const [store, i] = arg.split("|"); buyCar(store, CAR_STORES[store][Number(i)]); },
  buyRealEstate: (arg) => { const [market, i, mort] = arg.split("|"); buyRealEstate(market, REAL_ESTATE[market][Number(i)], mort === "1"); },

  openDating: () => openDatingFlow(),
  goOnDate: (arg) => goOnDate(arg === "1"),

  continueAfterGraduation: () => continueAfterGraduation(),
  openHigherEd: () => openHigherEdFlow(),
  applyHigherEd: (arg) => applyHigherEd(arg),
  declarePremed: () => declarePremed(),
  continueAfterSeasonRecap: () => continueAfterSeasonRecap(),
  restart: () => {
    screen = "create"; character = null; ctx = null; age = 0; activeFlow = null; endResult = null;
    createDraft = { first: "Alex", last: "Rivera", gender: "Male", country: "United States", city: "New York",
      curriculum: "ib", talent: null, ageMode: "yearly", uiTheme: "passport",
      stats: { health: 5, look: 5, smarts: 5, happiness: 5 }, pool: START_POOL };
    render();
  },
};

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const action = btn.dataset.action;
  if (!action || !ACTIONS[action]) return;
  ACTIONS[action](btn.dataset.arg, btn.dataset.arg2, btn);
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* not available in this hosting context, e.g. Artifact preview */ });
  });
}
</script>
</body>
</html>
