  <title>Wall Street Grind — Investment Banker Sim</title>

  <style>
/* ==========================================================================
   Wall Street Grind — theme: dark navy + gold, dashboard-style UI
   ========================================================================== */

:root {
  --navy-950: #0a0e17;
  --navy-900: #0f1420;
  --navy-800: #151c2c;
  --navy-700: #1c2540;
  --navy-600: #263258;
  --gold: #d4af37;
  --gold-bright: #f0cf5e;
  --text: #e8ebf2;
  --text-dim: #9aa4bd;
  --green: #3ecf8e;
  --red: #e5586b;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: radial-gradient(circle at top, var(--navy-800), var(--navy-950) 70%);
  color: var(--text);
  font-family: "Segoe UI", Roboto, -apple-system, Arial, sans-serif;
  min-height: 100vh;
}

#app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 20px 90px;
}

/* ---------------- Header ---------------- */

#header {
  background: linear-gradient(135deg, var(--navy-700), var(--navy-800));
  border: 1px solid var(--navy-600);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.35);
}

.hdr-row1 {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.hdr-name { font-size: 1.3rem; font-weight: 700; color: var(--gold-bright); }
.hdr-age, .hdr-status { color: var(--text-dim); font-size: 0.92rem; }
.hdr-status { margin-left: auto; font-weight: 600; color: var(--text); }
.layout-toggle {
  background: var(--navy-900); border: 1px solid var(--navy-600); border-radius: 8px;
  font-size: 1rem; line-height: 1; padding: 6px 9px; cursor: pointer; color: var(--text);
}
.layout-toggle:hover { border-color: var(--gold); }

.hdr-row2 { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  background: var(--navy-900); border: 1px solid var(--navy-600);
  border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; color: var(--text-dim);
}
.chip b { color: var(--text); font-size: 0.95rem; }
.chip.debt b { color: var(--red); }
.pos { color: var(--green) !important; }
.neg { color: var(--red) !important; }
.due-badge {
  background: var(--red); color: white; font-size: 0.68rem; font-weight: 700;
  padding: 2px 6px; border-radius: 6px; margin-left: 4px; vertical-align: middle;
}

.hdr-bars { display: flex; gap: 18px; flex-wrap: wrap; }
.bar-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-dim); }
.bar { width: 110px; height: 8px; background: var(--navy-900); border-radius: 5px; overflow: hidden; border: 1px solid var(--navy-600); }
.bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
.bar-fill.energy { background: linear-gradient(90deg, #4fa3e3, #7fd1ff); }
.bar-fill.stress { background: linear-gradient(90deg, #e5586b, #ff8b8b); }
.bar-fill.happy { background: linear-gradient(90deg, #3ecf8e, #9bf0c9); }
.bar-fill.rep { background: linear-gradient(90deg, var(--gold), var(--gold-bright)); }
.bar-fill.skill { background: linear-gradient(90deg, var(--gold), #8a6d1f); }

/* ---------------- Tabs ---------------- */

#tabs {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
  position: sticky; top: 0; z-index: 5; padding: 6px 0;
}
.tab-btn {
  background: var(--navy-800); border: 1px solid var(--navy-600); color: var(--text-dim);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.88rem;
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--text); border-color: var(--gold); }
.tab-btn.active { background: var(--navy-600); color: var(--gold-bright); border-color: var(--gold); font-weight: 600; }
.end-month-btn {
  margin-left: auto; background: linear-gradient(135deg, var(--gold), #a9822b);
  color: var(--navy-950); font-weight: 700; border: none;
}
.end-month-btn:hover { filter: brightness(1.1); border-color: transparent; color: var(--navy-950); }

/* ---------------- Cards & layout ---------------- */

.grid-2 {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px;
}
.firm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 20px; }

.card {
  background: var(--navy-800); border: 1px solid var(--navy-600);
  border-radius: var(--radius); padding: 16px 18px;
}
.card.highlight { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(212,175,55,0.25) inset; }
.card.current { border-color: var(--green); }
.card h3, .card h4 { margin: 0 0 8px; color: var(--gold-bright); }
.card p { margin: 4px 0; font-size: 0.92rem; line-height: 1.4; }
.big-num { font-size: 1.6rem; font-weight: 700; color: var(--text); }
.muted { color: var(--text-dim); font-size: 0.82rem; }
.locked { color: var(--text-dim); font-size: 0.8rem; font-style: italic; }
.section-title { color: var(--gold-bright); margin: 18px 0 10px; }

.progress-outer { width: 100%; height: 10px; background: var(--navy-900); border-radius: 6px; overflow: hidden; border: 1px solid var(--navy-600); margin: 8px 0; }
.progress-inner { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); }

.skill-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.skill-label { width: 110px; font-size: 0.85rem; }
.skill-val { width: 28px; text-align: right; font-size: 0.85rem; color: var(--text-dim); }

.log-list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
.log-list.full { max-height: 65vh; }
.log-list li { padding: 6px 0; border-bottom: 1px solid var(--navy-700); font-size: 0.86rem; }
.log-list li:last-child { border-bottom: none; }

/* ---------------- Buttons & inputs ---------------- */

.btn {
  background: var(--navy-700); color: var(--text); border: 1px solid var(--navy-600);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.86rem; margin: 3px 4px 3px 0;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--gold); color: var(--gold-bright); }
.btn-primary { background: linear-gradient(135deg, var(--gold), #a9822b); color: var(--navy-950); font-weight: 700; border: none; }
.btn-primary:hover { filter: brightness(1.1); color: var(--navy-950); }
.btn-danger { background: rgba(229,88,107,0.15); border-color: var(--red); color: var(--red); }
.btn-row { display: flex; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.num-input, input[type="text"], input[type="number"] {
  background: var(--navy-900); border: 1px solid var(--navy-600); color: var(--text);
  padding: 8px 10px; border-radius: 8px; font-size: 0.86rem; width: 120px; margin: 3px 4px 3px 0;
}
.field-label { display: block; margin: 10px 0 4px; color: var(--text-dim); font-size: 0.85rem; }

.layout-choice { display: flex; gap: 10px; margin: 4px 0 10px; }
.layout-btn {
  flex: 1; background: var(--navy-900); border: 1px solid var(--navy-600); color: var(--text-dim);
  padding: 12px 10px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; text-align: center;
}
.layout-btn.active { border-color: var(--gold); color: var(--gold-bright); background: var(--navy-700); font-weight: 600; }

/* ---------------- Toast ---------------- */

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px);
  background: var(--navy-700); border: 1px solid var(--gold); color: var(--text);
  padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none;
  transition: all 0.25s; z-index: 50; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { border-color: var(--red); color: var(--red); }

/* ---------------- Modal ---------------- */

.modal-overlay {
  position: fixed; inset: 0; background: rgba(5,7,12,0.78);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--navy-800); border: 1px solid var(--gold);
  border-radius: 14px; padding: 24px 26px; max-width: 460px; width: 100%;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.modal-box.wide { max-width: 760px; }
.modal-box h2 { color: var(--gold-bright); margin-top: 0; }

/* ---------------- Minigame / interview ---------------- */

.minigame-box { max-width: 560px; }
.minigame-header { font-size: 1.1rem; font-weight: 700; color: var(--gold-bright); display: flex; justify-content: space-between; align-items: center; }
.minigame-progress { font-size: 0.8rem; color: var(--text-dim); font-weight: 400; }
.minigame-sub { color: var(--text-dim); font-size: 0.88rem; margin: 8px 0 14px; }
.minigame-timerbar { width: 100%; height: 6px; background: var(--navy-900); border-radius: 4px; overflow: hidden; margin: 12px 0; }
.minigame-timerfill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); transition: width 0.2s linear; }
.minigame-question { font-size: 1.05rem; margin: 10px 0 16px; line-height: 1.4; }
.minigame-options { display: flex; flex-direction: column; gap: 8px; }
.option-btn { text-align: left; padding: 10px 14px; }
.minigame-result-score { font-size: 2.4rem; font-weight: 800; color: var(--gold-bright); text-align: center; margin: 10px 0; }

.reflex-box {
  margin-top: 18px; height: 140px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; font-weight: 700; cursor: pointer; user-select: none; transition: background 0.1s;
}
.reflex-box.waiting { background: #7a2432; color: #ffd1d6; }
.reflex-box.go { background: #1f7a4d; color: #d3ffe9; }
.reflex-box.early { background: #444; color: #ccc; }

.simon-grid {
  margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.simon-box {
  height: 90px; border-radius: 12px; border: 1px solid var(--navy-600);
  background: var(--navy-700); color: var(--text); font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.simon-box:disabled { cursor: default; }
.simon-box.active { background: var(--gold); color: var(--navy-950); border-color: var(--gold-bright); transform: scale(1.04); }
.simon-box:nth-child(1) { border-top: 3px solid #4fa3e3; }
.simon-box:nth-child(2) { border-top: 3px solid #3ecf8e; }
.simon-box:nth-child(3) { border-top: 3px solid #e5586b; }
.simon-box:nth-child(4) { border-top: 3px solid #d4af37; }

/* ---------------- Responsive ---------------- */

@media (max-width: 640px) {
  .hdr-status { margin-left: 0; }
  #app { padding: 12px 10px 90px; }
}

/* ---------------- Mobile layout mode (chosen at character creation, or toggled anytime) ---------------- */

.ui-mobile #app { max-width: 100%; padding: 10px 10px 92px; }

.ui-mobile #header { position: relative; padding: 12px 88px 12px 14px; }
.ui-mobile .hdr-row1 { flex-direction: column; align-items: flex-start; gap: 3px; margin-bottom: 6px; }
.ui-mobile .hdr-name { font-size: 1.15rem; }
.ui-mobile .hdr-age, .ui-mobile .hdr-status { font-size: 0.82rem; }
.ui-mobile .hdr-status { margin-left: 0; }
.ui-mobile .layout-toggle { position: absolute; top: 12px; right: 12px; }
.ui-mobile .save-toggle { right: 54px; }
.ui-mobile .hdr-row2 { gap: 6px; margin-bottom: 8px; }
.ui-mobile .chip { padding: 5px 9px; font-size: 0.76rem; }
.ui-mobile .hdr-bars { gap: 10px 16px; }
.ui-mobile .bar { width: 64px; }

.ui-mobile #tabs {
  position: fixed; left: 0; right: 0; bottom: 0; top: auto;
  background: var(--navy-900); border-top: 1px solid var(--navy-600);
  margin: 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
  gap: 6px; z-index: 30; box-shadow: 0 -4px 18px rgba(0,0,0,0.4);
}
.ui-mobile .tab-btn {
  flex: 0 0 auto; padding: 10px 14px; font-size: 0.8rem; min-height: 42px;
  display: flex; align-items: center;
}
.ui-mobile .end-month-btn { margin-left: 0; order: -1; }

.ui-mobile .grid-2, .ui-mobile .firm-grid { grid-template-columns: 1fr; gap: 12px; }
.ui-mobile .card { padding: 14px 16px; }
.ui-mobile .card h3, .ui-mobile .card h4 { font-size: 1.02rem; }

.ui-mobile .btn { display: block; width: 100%; min-height: 44px; margin: 4px 0; text-align: center; }
.ui-mobile .btn-row { flex-direction: column; align-items: stretch; }
.ui-mobile .btn-row .btn { margin: 4px 0; }
.ui-mobile .num-input,
.ui-mobile input[type="text"],
.ui-mobile input[type="number"] { width: 100%; min-height: 42px; margin: 4px 0; }

.ui-mobile .modal-overlay { padding: 0; align-items: flex-end; }
.ui-mobile .modal-box {
  max-width: 100%; width: 100%; border-radius: 16px 16px 0 0;
  max-height: 92vh; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
}
.ui-mobile .modal-box.wide { max-width: 100%; }
.ui-mobile .option-btn { min-height: 50px; }
.ui-mobile .layout-choice { flex-direction: column; }
.ui-mobile .reflex-box { height: 170px; font-size: 1.6rem; }
.ui-mobile .simon-box { height: 110px; font-size: 1.15rem; }
.ui-mobile .toast { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }

</style>

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pickRandom(arr) { return arr[randInt(0, arr.length - 1)]; }
function fmtMoney(n) {
  const neg = n < 0;
  const s = Math.round(Math.abs(n)).toLocaleString("en-US");
  return (neg ? "-$" : "$") + s;
}

/* ---------------- Loan amortization ---------------- */

function calcMonthlyLoanPayment(principal, apr, termMonths) {
  const r = apr / 12;
  const factor = Math.pow(1 + r, termMonths);
  return principal * r * factor / (factor - 1);
}

/* ---------------- New game ---------------- */

function generateDatingPool() {
  const pool = [];
  const usedNames = new Set();
  const count = 7;
  for (let i = 0; i < count; i++) {
    let name = pickRandom(DATA.DATING_NAMES);
    while (usedNames.has(name)) name = pickRandom(DATA.DATING_NAMES);
    usedNames.add(name);
    pool.push({
      id: "d" + i,
      name,
      job: pickRandom(DATA.DATING_JOBS),
      bio: pickRandom(DATA.DATING_BIOS),
      compatibility: randInt(40, 95),
      relationship: 0,
      status: "unmet" // unmet -> talking -> dating -> partner -> married
    });
  }
  return pool;
}

// The canonical default shape for a brand-new character. Also used as a
// merge base when loading saves, so any fields missing from an older save
// (the schema has changed across versions) fall back to safe defaults
// instead of leaving STATE with undefined properties that crash renders.
function freshStateDefaults() {
  const minMonthly = calcMonthlyLoanPayment(DATA.STARTING_DEBT, DATA.LOAN_APR, DATA.LOAN_TERM_MONTHS);

function newGame(name, slot) {
  Object.keys(STATE).forEach(k => delete STATE[k]);
  Object.assign(STATE, freshStateDefaults(), {
    name: name || "Alex Ward",
    activeSlot: slot || 1
  });

  logEvent("You graduated with a finance degree, $450,000 in student debt, and a dream: become the best investment banker who ever lived.");
  save();
}

function logEvent(text) {
  STATE.log.unshift({ month: STATE.totalMonths, text });
  if (STATE.log.length > 200) STATE.log.length = 200;
}

/* ---------------- Persistence (5 save slots) ---------------- */

function slotKey(slot) { return SAVE_KEY_PREFIX + slot; }

function getActiveSlot() {
  try {
    const v = Number(localStorage.getItem(ACTIVE_SLOT_KEY));
    return v >= 1 && v <= SAVE_SLOT_COUNT ? v : null;
  } catch (e) { return null; }
}

function setActiveSlot(slot) {
  STATE.activeSlot = slot;
  try { localStorage.setItem(ACTIVE_SLOT_KEY, String(slot)); } catch (e) { /* ignore */ }
}

// One-time migration: bring an old single-save-file player into slot 1,
// and make it the active slot so their game still resumes automatically.
function migrateLegacySave() {
  try {
    const legacy = localStorage.getItem(LEGACY_SAVE_KEY);
    if (!legacy) return;
    if (!localStorage.getItem(slotKey(1))) {
      localStorage.setItem(slotKey(1), legacy);
    }
    if (!localStorage.getItem(ACTIVE_SLOT_KEY)) {
      localStorage.setItem(ACTIVE_SLOT_KEY, "1");
    }
    localStorage.removeItem(LEGACY_SAVE_KEY);
  } catch (e) { /* ignore */ }
}

function save() {
  const slot = STATE.activeSlot || getActiveSlot() || 1;
  try { localStorage.setItem(slotKey(slot), JSON.stringify(STATE)); } catch (e) { /* storage unavailable */ }
}

function load(slot) {
  try {
    const raw = localStorage.getItem(slotKey(slot));
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    Object.keys(STATE).forEach(k => delete STATE[k]);
    // Merge onto fresh defaults first so fields missing from an older save
    // (schema drift across versions) don't leave STATE with undefined spots.
    Object.assign(STATE, freshStateDefaults(), parsed);
    STATE.activeSlot = slot;
    return true;
  } catch (e) { return false; }
}

function hasSaveInSlot(slot) {
  try { return !!localStorage.getItem(slotKey(slot)); } catch (e) { return false; }
}

function deleteSlot(slot) {
  try { localStorage.removeItem(slotKey(slot)); } catch (e) { /* ignore */ }
}

// Wipes only the currently active slot (used by "start a new career" after game over).
function wipeSave() {
  const slot = STATE.activeSlot || getActiveSlot() || 1;
  deleteSlot(slot);
}

function getSlotSummary(slot) {
  try {
    const raw = localStorage.getItem(slotKey(slot));
    if (!raw) return null;
    const s = JSON.parse(raw);
    let status = "Unemployed";
    if (s.education && s.education.inMBA) {
      status = "MBA Student";
    } else if (s.employment) {
      const titles = s.employment.track === "IB" ? DATA.TITLES_IB : DATA.TITLES_PE;
      const firm = DATA.FIRMS.find(f => f.id === s.employment.firmId);
      status = `${titles[s.employment.titleIndex]}${firm ? " @ " + firm.name : ""}`;
    }
    const car = s.car && s.car.id !== "none" ? DATA.CARS.find(c => c.id === s.car.id) : null;
    const carValue = car ? car.cashPrice * 0.55 : 0;
    const netWorth = Math.round((s.cash || 0) + (s.savings || 0) + (s.investment || 0) + carValue - (s.debt || 0) - (s.car ? s.car.balance || 0 : 0));
    return {
      name: s.name, ageYears: s.ageYears, ageMonths: s.ageMonths,
      status, netWorth, gameOver: !!s.gameOver
    };
  } catch (e) { return null; }
}

/* ---------------- Derived helpers ---------------- */

function currentTitleTrackName() {
  if (!STATE.employment) return null;
  return STATE.employment.track === "IB" ? DATA.TITLES_IB[STATE.employment.titleIndex] : DATA.TITLES_PE[STATE.employment.titleIndex];
}

function currentFirm() {
  if (!STATE.employment) return null;
  return DATA.FIRMS.find(f => f.id === STATE.employment.firmId);
}

function currentBaseSalary() {
  if (!STATE.employment) return 0;
  const firm = currentFirm();
  const base = STATE.employment.track === "IB" ? DATA.BASE_IB[STATE.employment.titleIndex] : DATA.BASE_PE[STATE.employment.titleIndex];
  return Math.round(base * firm.mult);
}

function titleSeniorityLabel() {
  // Used for gating apartments/cars ("VP" / "Associate" tier and above)
  if (!STATE.employment) return "None";
  const idx = STATE.employment.titleIndex;
  if (STATE.employment.track === "IB") {
    if (idx >= 6) return "VP";
    if (idx >= 3) return "Associate";
    return "Analyst";
  } else {
    if (idx >= 2) return "VP";
    return "Associate";
  }
}

function meetsSeniority(reqTrack) {
  const order = ["Analyst", "Associate", "VP"];
  const cur = titleSeniorityLabel();
  if (cur === "None") return false;
  return order.indexOf(cur) >= order.indexOf(reqTrack);
}

function netWorth() {
  const carValue = STATE.car.id !== "none" ? (DATA.CARS.find(c => c.id === STATE.car.id).cashPrice * 0.55) : 0;
  return Math.round(STATE.cash + STATE.savings + STATE.investment + carValue - STATE.debt - STATE.car.balance);
}

function ageString() {
  return STATE.ageYears + "y " + STATE.ageMonths + "m";
}

function addStress(v) { STATE.stress = clamp(STATE.stress + v, 0, 100); }
function addHappiness(v) { STATE.happiness = clamp(STATE.happiness + v, 0, 100); }
function addReputation(v) { STATE.reputation = clamp(STATE.reputation + v, -100, 200); }
function addSkill(skill, v) { STATE.skills[skill] = clamp(STATE.skills[skill] + v, 0, 100); }

/* ---------------- Networking ---------------- */

ENGINE.doNetworkingEvent = function (eventId) {
  const ev = DATA.NETWORKING_EVENTS.find(e => e.id === eventId);
  if (!ev) return { ok: false, msg: "Unknown event." };
  if (!canAfford(ev.cost)) return { ok: false, msg: "You can't afford this event." };
  if (!hasEnergy(ev.energy)) return { ok: false, msg: "You're too exhausted for this." };
  spend(ev.cost);
  spendEnergy(ev.energy);
  const netGain = randInt(ev.networkingGain[0], ev.networkingGain[1]);
  const commGain = randInt(ev.commGain[0], ev.commGain[1]);
  addSkill("networking", netGain);
  addSkill("communication", commGain);
  addHappiness(1);
  logEvent(`Attended "${ev.name}" — Networking +${netGain}, Communication +${commGain}.`);
  save();
  return { ok: true };
};

/* ---------------- Training ---------------- */

ENGINE.doTraining = function (actionId) {
  const a = DATA.TRAINING_ACTIONS.find(x => x.id === actionId);
  if (!a) return { ok: false, msg: "Unknown action." };
  if (!canAfford(a.cost)) return { ok: false, msg: "You can't afford this." };

  spend(a.cost);
  spendEnergy(a.energy);

  addSkill(a.skill, gain);

/* ---------------- Career: applying & hiring ---------------- */

ENGINE.firmEligibility = function (firmId) {
  const firm = DATA.FIRMS.find(f => f.id === firmId);
  const reasons = [];
  if (firm.type === "PE" && STATE.ibExperienceMonths < firm.minIBMonths) {
    reasons.push(`Requires ${Math.round(firm.minIBMonths / 12 * 10) / 10}+ years of IB experience.`);
  }
  if (STATE.skills.networking < firm.reqNetworking) reasons.push(`Needs Networking ${firm.reqNetworking}+ (you: ${STATE.skills.networking}).`);
  if (STATE.skills.communication < firm.reqComm) reasons.push(`Needs Communication ${firm.reqComm}+ (you: ${STATE.skills.communication}).`);
  return { eligible: reasons.length === 0, reasons };
};

ENGINE.hireAtFirm = function (firmId, track, offerScore) {
  const firm = DATA.FIRMS.find(f => f.id === firmId);
  let titleIndex = 0;
  if (STATE.education.hasMBA && track === "IB") titleIndex = 3; // Associate I
  if (STATE.education.hasMBA && track === "PE") titleIndex = 0; // PE Associate
  if (track === "PE" && !STATE.education.hasMBA) titleIndex = 0;

  STATE.employment = {
    firmId, track, titleIndex,
    monthsInTitle: 0,
    monthsAtFirm: 0,
    perfAccum: [],
    yearPerfAccum: [],
    strikes: 0
  };
  addReputation(5);
  logEvent(`You accepted an offer from ${firm.name} as ${track === "IB" ? DATA.TITLES_IB[titleIndex] : DATA.TITLES_PE[titleIndex]}!`);
  save();
};

ENGINE.resign = function () {
  if (!STATE.employment) return;
  const firm = currentFirm();
  logEvent(`You resigned from ${firm.name}.`);
  STATE.employment = null;
  addStress(10);
  save();
};

/* ---------------- MBA ---------------- */

ENGINE.canStartMBA = function () {
  return (STATE.careerMonthsWorked || 0) >= 36 && !STATE.education.inMBA && !STATE.education.hasMBA;
};

ENGINE.startMBA = function (recruitTarget) {
  if (!ENGINE.canStartMBA()) return { ok: false, msg: "You're not eligible yet." };
  if (STATE.employment) ENGINE.resign();
  STATE.debt += 220000;
  STATE.education.inMBA = true;
  STATE.education.mbaMonthsLeft = 24;
  STATE.education.recruitTarget = recruitTarget;
  STATE.education.perfAccum = [];
  addStress(8);
  logEvent(`You enrolled in a top MBA program. Tuition and living costs added $220,000 to your debt. Two years of full-time study begin now.`);
  save();
  return { ok: true };
};

function graduateMBA() {
  STATE.education.inMBA = false;
  STATE.education.hasMBA = true;
  const acc = STATE.education.perfAccum || [];
  const avg = acc.length ? acc.reduce((a, b) => a + b, 0) / acc.length : 0.4;
  logEvent(`You graduated with your MBA. Recruiting performance score: ${(avg * 100).toFixed(0)}/100.`);

  const target = STATE.education.recruitTarget || "IB";
  let candidates = DATA.FIRMS.filter(f => f.type === target && (target === "IB" || STATE.ibExperienceMonths >= f.minIBMonths));
  if (candidates.length === 0) candidates = DATA.FIRMS.filter(f => f.type === "IB");
  candidates = candidates.slice().sort((a, b) => a.prestige - b.prestige);

  let chosen;
  if (avg >= 0.75) chosen = candidates[candidates.length - 1];
  else if (avg >= 0.5) chosen = candidates[Math.floor(candidates.length / 2)];
  else chosen = candidates[0];

  ENGINE.hireAtFirm(chosen.id, target, avg);
  save();
}

/* ---------------- Housing ---------------- */

ENGINE.moveApartment = function (aptId) {
  const apt = DATA.APARTMENTS.find(a => a.id === aptId);
  if (!apt) return { ok: false, msg: "Unknown apartment." };
  if (apt.minTitleTrack && !meetsSeniority(apt.minTitleTrack)) {
    return { ok: false, msg: `You need to be at least a ${apt.minTitleTrack} to qualify for this address.` };
  }
  if (!canAfford(apt.moveInCost)) return { ok: false, msg: "You can't afford the move-in cost (deposit + fees)." };
  spend(apt.moveInCost);
  STATE.apartmentId = aptId;
  STATE.evictionWarnings = 0;
  logEvent(`You moved into: ${apt.name}.`);
  save();
  return { ok: true };
};

/* ---------------- Cars ---------------- */

ENGINE.buyCar = function (carId, financed) {
  const car = DATA.CARS.find(c => c.id === carId);
  if (!car) return { ok: false, msg: "Unknown car." };
  if (car.minTitleTrack && !meetsSeniority(car.minTitleTrack)) {
    return { ok: false, msg: `You need to be at least a ${car.minTitleTrack} for this car.` };
  }
  if (STATE.car.balance > 0) return { ok: false, msg: "Pay off or sell your current car first." };

  if (carId === "none") {
    STATE.car = { id: "none", balance: 0, missedPayments: 0 };
    logEvent("You sold your car. Back to the subway.");
    save();
    return { ok: true };
  }

  if (financed) {
    if (!canAfford(car.downPayment)) return { ok: false, msg: "You can't afford the down payment." };
    spend(car.downPayment);
    STATE.car = { id: carId, balance: car.cashPrice - car.downPayment, missedPayments: 0 };
    logEvent(`You financed a ${car.name}. Down payment: ${fmtMoney(car.downPayment)}.`);
  } else {
    if (!canAfford(car.cashPrice)) return { ok: false, msg: "You can't afford this car in cash." };
    spend(car.cashPrice);
    STATE.car = { id: carId, balance: 0, missedPayments: 0 };
    logEvent(`You bought a ${car.name} in cash.`);
  }
  addReputation(Math.round(car.reputation / 2));
  save();
  return { ok: true };
};

  STATE.cash -= amount;
  STATE.savings += amount;
  save();
  return { ok: true };
};

ENGINE.transferToChecking = function (amount) {

};

ENGINE.investFunds = function (amount) {

ENGINE.payLoan = function (amount) {
  if (amount <= 0 || amount > STATE.cash) return { ok: false, msg: "Invalid amount." };
  const payment = Math.min(amount, STATE.debt);
  STATE.cash -= payment;
  STATE.debt = Math.max(0, STATE.debt - payment);
  if (amount >= STATE.loanMinPayment - 0.01 || STATE.debt === 0) {
    STATE.loanPaymentDue = false;
    STATE.loanMissedPayments = 0;
  }
  addSkill("discipline", 1);
  logEvent(`Paid ${fmtMoney(payment)} toward your student loans. Balance: ${fmtMoney(STATE.debt)}.`);
  save();
  return { ok: true };
};

/* ---------------- Interview resolution ---------------- */

ENGINE.resolveInterview = function (firmId, track, scorePct) {
  const firm = DATA.FIRMS.find(f => f.id === firmId);
  const commBoost = STATE.skills.communication / 250; // up to +0.4
  const finalScore = clamp(scorePct + commBoost + 0.12, 0, 1); // +0.12 base courtesy cushion
  let outcome;
  if (finalScore >= 0.7) outcome = "strong";
  else if (finalScore >= 0.42) outcome = "pass";
  else if (finalScore >= 0.22) outcome = "borderline";
  else outcome = "reject";

  if (outcome === "reject") {
    logEvent(`${firm.name} passed on you this round. Keep networking and sharpen up.`);
    addStress(5);
    save();
    return { hired: false, outcome };
  }

  // Even a good interview doesn't guarantee an offer -- more prestigious firms
  // have far more applicants per seat, independent of how well you did.
  const competitiveness = firm.competitiveness != null ? firm.competitiveness : 0.3;
  const tierBaseChance = { strong: 0.92, pass: 0.72, borderline: 0.45 }[outcome];
  let hireChance = clamp(tierBaseChance - competitiveness * 0.5, 0.04, 0.97);

  // A near-perfect (100/100) interview is memorable enough to blow past
  // ordinary competitiveness -- everyone wants the candidate who nailed it.
  if (scorePct >= 0.97) hireChance = Math.max(hireChance, 0.95);

  if (Math.random() > hireChance) {
    logEvent(`${firm.name} liked what they saw, but the seat went to another candidate — roles at a ${firm.tier} shop are brutally competitive.`);
    addStress(4);
    save();
    return { hired: false, outcome };
  }

  ENGINE.hireAtFirm(firmId, track, finalScore);
  return { hired: true, outcome };
};

/* ---------------- Monthly work performance -> pay math ---------------- */

function performanceToBonusMult(range, score) {
  return range[0] + (range[1] - range[0]) * score;
}

// Rough combined effective rate (federal + state + city + FICA) for a NYC-based banker.
function effectiveTaxRate(annualIncome) {
  if (annualIncome < 60000) return 0.20;
  if (annualIncome < 120000) return 0.26;
  if (annualIncome < 220000) return 0.31;
  if (annualIncome < 450000) return 0.36;
  if (annualIncome < 900000) return 0.40;
  return 0.43;
}

function payMonthlyPaycheck() {
  if (!STATE.employment) return;
  const annual = currentBaseSalary();
  const grossMonthly = annual / 12;
  const netMonthly = grossMonthly * (1 - effectiveTaxRate(annual));
  STATE.cash += netMonthly;
}

function checkPromotion() {
  const e = STATE.employment;
  const track = e.track;
  const titles = track === "IB" ? DATA.TITLES_IB : DATA.TITLES_PE;
  const monthsArr = track === "IB" ? DATA.MONTHS_PER_TITLE_IB : DATA.MONTHS_PER_TITLE_PE;
  const monthsNeeded = monthsArr[e.titleIndex];
  if (e.monthsInTitle < monthsNeeded) return;
  if (e.titleIndex >= titles.length - 1) return; // already at top

  const avg = e.perfAccum.length ? e.perfAccum.reduce((a, b) => a + b, 0) / e.perfAccum.length : 0.4;
  if (avg >= 0.45) {
    e.titleIndex++;
    e.monthsInTitle = 0;
    e.perfAccum = [];
    addReputation(8);
    logEvent(`Promoted to ${titles[e.titleIndex]}! Your hard work paid off.`);
  } else {
    // Not promoted on schedule; gentle reset window, slight morale hit
    e.monthsInTitle = Math.round(monthsNeeded * 0.5);
    addStress(6);
    logEvent(`You were passed over for promotion this cycle. Performance needs to improve.`);
  }
}

const OUTPERFORMANCE_THRESHOLD = 0.6; // performance score above 60/100
const OUTPERFORMANCE_BONUS_RATE = 0.12; // extra % of base salary

function payYearEndBonus() {
  const e = STATE.employment;
  const track = e.track;
  const range = (track === "IB" ? DATA.BONUS_RANGE_IB : DATA.BONUS_RANGE_PE)[e.titleIndex];
  const acc = e.yearPerfAccum && e.yearPerfAccum.length ? e.yearPerfAccum : e.perfAccum;
  const avg = acc.length ? acc.reduce((a, b) => a + b, 0) / acc.length : 0.4;
  const salesBoost = STATE.skills.sales / 500; // up to +0.2
  const mult = performanceToBonusMult(range, clamp(avg + salesBoost, 0, 1));
  const grossBonus = Math.round(currentBaseSalary() * mult);
  const netBonus = Math.round(grossBonus * (1 - effectiveTaxRate(currentBaseSalary() + grossBonus)));
  STATE.cash += netBonus;
  logEvent(`Year-end bonus at ${currentFirm().name}: ${fmtMoney(netBonus)} after tax (gross ${fmtMoney(grossBonus)}, performance ${(avg * 100).toFixed(0)}/100).`);

  if (avg > OUTPERFORMANCE_THRESHOLD) {
    const grossKicker = Math.round(currentBaseSalary() * OUTPERFORMANCE_BONUS_RATE);
    const netKicker = Math.round(grossKicker * (1 - effectiveTaxRate(currentBaseSalary() + grossBonus + grossKicker)));
    STATE.cash += netKicker;
    addReputation(3);
    logEvent(`Outperformance bonus: your ${(avg * 100).toFixed(0)}/100 average this year topped the firm's 60/100 bar, earning an extra ${fmtMoney(netKicker)}.`);
  }
}

/* ---------------- Billing ---------------- */

function billRent() {
  if (!STATE.apartmentId) return;
  const apt = DATA.APARTMENTS.find(a => a.id === STATE.apartmentId);
  STATE.cash -= apt.monthlyRent;
  if (STATE.cash < -1500) {
    STATE.evictionWarnings++;
    addStress(4);
    if (STATE.evictionWarnings >= 4) {
      logEvent(`You fell too far behind on rent and were evicted from ${apt.name}. You're back in your parents' basement.`);
      STATE.apartmentId = "basement";
      STATE.evictionWarnings = 0;
      addReputation(-6);
    }
  } else {
    STATE.evictionWarnings = Math.max(0, STATE.evictionWarnings - 1);
  }
}

function billCarLoan() {
  if (STATE.car.balance <= 0) return;
  const car = DATA.CARS.find(c => c.id === STATE.car.id);
  if (STATE.cash >= car.monthlyPayment) {
    STATE.cash -= car.monthlyPayment;
    STATE.car.balance = Math.max(0, STATE.car.balance - car.monthlyPayment);
    STATE.car.missedPayments = 0;
  } else {
    STATE.car.missedPayments++;
    addStress(6);
    addReputation(-3);
    logEvent(`You missed your car payment on the ${car.name}.`);
    if (STATE.car.missedPayments >= 3) {
      logEvent(`Your ${car.name} was repossessed.`);
      STATE.car = { id: "none", balance: 0, missedPayments: 0 };
      addReputation(-10);
    }
  }
}

function billStudentLoan() {
  if (STATE.debt <= 0) return;

  if (STATE.loanPaymentDue) {
    // Payment was due and never made -> penalty
    const lateFee = 175;
    STATE.debt += lateFee;
    STATE.loanMissedPayments = (STATE.loanMissedPayments || 0) + 1;
    addSkill("discipline", -4);
    addReputation(-4);
    addStress(10);
    logEvent(`You missed your student loan payment! A ${fmtMoney(lateFee)} late fee was added and your credit took a hit.`);
    if (STATE.loanMissedPayments >= 4) {
      STATE.gameOver = true;
      STATE.gameOverReason = "Your student loans went into default. Wages garnished, credit destroyed — your banking career is over.";
    }
  }

  const interest = STATE.debt * (STATE.loanAPR / 12);
  STATE.debt += interest;
  STATE.loanPaymentDue = true;
}

function billSavingsAndInvestments() {
  STATE.savings *= (1 + DATA.SAVINGS_APY / 12);
  if (STATE.investment > 0) {
    STATE.investment *= (1 + rand(-0.06, 0.07));
  }
}

function maybeRandomEvent() {
  if (Math.random() > 0.35) return;
  const ev = pickRandom(DATA.LIFE_EVENTS);
  if (ev.cash) STATE.cash += ev.cash;
  if (ev.stress) addStress(ev.stress);
  if (ev.energy) STATE.energy = clamp(STATE.energy + ev.energy, 0, STATE.maxEnergy);
  if (ev.happiness) addHappiness(ev.happiness);
  logEvent(ev.text);
}

function datingDecay() {
  STATE.dating.pool.forEach(c => {
    if (c.status === "dating" || c.status === "partner" || c.status === "married") {
      const decay = c.status === "married" ? 1 : 2;
      c.relationship = clamp(c.relationship - decay, 0, 100);
      if (c.relationship <= 0 && c.status !== "married" && STATE.dating.partnerId === c.id) {
        ENGINE.breakUp();
      }
    }
  });
}

/* ---------------- Month advance orchestration ---------------- */

ENGINE.needsMinigameThisMonth = function () {
  return !!STATE.employment || STATE.education.inMBA;
};

ENGINE.finishMonth = function (perfScore) {
  if (STATE.gameOver) return;

  // Age up
  STATE.ageMonths++;
  STATE.totalMonths++;
  if (STATE.ageMonths >= 12) {
    STATE.ageMonths = 0;
    STATE.ageYears++;
    addHappiness(5);
    logEvent(`Happy birthday — you're now ${STATE.ageYears}.`);
  }

  // Work / school performance
  if (STATE.employment && perfScore !== null && perfScore !== undefined) {
    payMonthlyPaycheck();
    STATE.employment.perfAccum.push(perfScore);
    STATE.employment.yearPerfAccum = STATE.employment.yearPerfAccum || [];
    STATE.employment.yearPerfAccum.push(perfScore);
    STATE.employment.monthsInTitle++;
    STATE.employment.monthsAtFirm++;
    STATE.careerMonthsWorked = (STATE.careerMonthsWorked || 0) + 1;
    if (STATE.employment.track === "IB") STATE.ibExperienceMonths++;

    if (perfScore < 0.2) {
      STATE.employment.strikes++;
      addStress(8);
      logEvent(`Rough month at the desk. Your MD noticed. (Strike ${STATE.employment.strikes}/3)`);
      if (STATE.employment.strikes >= 3) {
        const firmName = currentFirm().name;
        logEvent(`You were let go from ${firmName} after repeated performance issues.`);
        STATE.employment = null;
        addReputation(-15);
        addStress(15);
      }
    } else if (perfScore >= 0.7) {
      STATE.employment.strikes = Math.max(0, STATE.employment.strikes - 1);
      addSkill("discipline", 1);
    }

    if (STATE.employment) {
      if (STATE.employment.monthsAtFirm > 0 && STATE.employment.monthsAtFirm % 12 === 0) {
        payYearEndBonus();
        STATE.employment.yearPerfAccum = [];
      }
      checkPromotion();
    }
    spendEnergy(0); // energy already spent by minigame itself
  } else if (STATE.education.inMBA && perfScore !== null && perfScore !== undefined) {
    STATE.education.perfAccum = STATE.education.perfAccum || [];
    STATE.education.perfAccum.push(perfScore);
    STATE.education.mbaMonthsLeft--;
    if (STATE.education.mbaMonthsLeft <= 0) {
      graduateMBA();
    }
  }

  // Billing
  billRent();
  billCarLoan();
  billStudentLoan();
  billSavingsAndInvestments();
  datingDecay();
  maybeRandomEvent();

  // Energy & stress natural drift (monthly reset)
  STATE.energy = clamp(STATE.energy + 100, 0, STATE.maxEnergy);
  if (STATE.stress > 60) addHappiness(-2);
  addStress(STATE.happiness > 55 ? -3 : 1);
  if (STATE.debt > 0) addStress(1);

  // Debt payoff win flavor
  if (STATE.debt <= 0 && !STATE.debtFreeLogged) {
    STATE.debtFreeLogged = true;
    logEvent(`You are officially DEBT FREE. $450,000 paid off. Incredible.`);
    addHappiness(20);
    addStress(-15);
  }

  // Legend ending check (does not stop the game, just celebrates once)
  if (!STATE.legendShown && STATE.employment) {
    const topIB = STATE.employment.track === "IB" && STATE.employment.titleIndex === DATA.TITLES_IB.length - 1;
    const topPE = STATE.employment.track === "PE" && STATE.employment.titleIndex === DATA.TITLES_PE.length - 1;
    if (topIB || topPE) {
      STATE.legendShown = true;
      STATE.pendingLegend = true;
    }
  }

  if (STATE.cash < -25000) {
    STATE.gameOver = true;
    STATE.gameOverReason = "You spiraled into unmanageable debt and creditors came calling. Game over.";
  }

  save();
};


/* ---- js/minigames.js ---- */
/* ==========================================================================
   MINIGAMES.JS — the "actually do the work" mandatory monthly minigames.
   Two variants (Model Crunch, All-Nighter Reflex) alternate/roll randomly.
   Both resolve to a 0..1 performance score fed back into ENGINE.finishMonth.
   ========================================================================== */

const MINIGAMES = {};

function modalRoot() { return document.getElementById("modal-root"); }

function clearModal() { modalRoot().innerHTML = ""; modalRoot().classList.remove("open"); }

function openModalHTML(html) {
  const root = modalRoot();
  root.innerHTML = html;
  root.classList.add("open");
}

/* ---------------- Question generators for "Model Crunch" ---------------- */

function genQ_multiple() {
  const ebitda = randInt(15, 85);
  const mult = randInt(45, 135) / 10;
  const ev = Math.round(ebitda * mult);
  const opts = shuffleOptions(ev, [
    Math.round(ev * 0.85), Math.round(ev * 1.15), Math.round(ev * 1.3)
  ]);
  return {
    text: `EBITDA is $${ebitda}M. The comp set trades at ${mult.toFixed(1)}x. Implied Enterprise Value?`,
    options: opts.options, correctIndex: opts.correctIndex, fmt: v => "$" + v + "M"
  };
}

function genQ_growth() {
  const a = randInt(80, 400);
  const growthPct = randInt(5, 40);
  const b = Math.round(a * (1 + growthPct / 100));
  const opts = shuffleOptions(growthPct, [growthPct - 6, growthPct + 5, growthPct + 12].map(v => Math.max(1, v)));
  return {
    text: `Revenue grew from $${a}M to $${b}M. What's the approximate % growth?`,
    options: opts.options, correctIndex: opts.correctIndex, fmt: v => v + "%"
  };
}

function genQ_wacc() {
  const coe = randInt(9, 16);
  const cod = randInt(4, 8);
  const weq = randInt(40, 70);
  const wacc = Math.round((coe * weq + cod * (100 - weq)) / 100);
  const opts = shuffleOptions(wacc, [wacc - 4, wacc + 4, wacc + 8]);
  return {
    text: `Cost of equity ${coe}%, after-tax cost of debt ${cod}%, equity is ${weq}% of capital. Approx. WACC?`,
    options: opts.options, correctIndex: opts.correctIndex, fmt: v => v + "%"
  };
}

function genQ_eps() {
  const before = randInt(150, 400) / 100;
  const changePct = randInt(-25, 25);
  const after = Math.round(before * (1 + changePct / 100) * 100) / 100;
  const opts = shuffleOptions(changePct, [changePct - 8, changePct + 7, changePct + 15]);
  return {
    text: `Pro-forma EPS moves from $${before.toFixed(2)} to $${after.toFixed(2)}. Is this deal accretive or dilutive, and by roughly what %?`,
    options: opts.options.map(v => (v >= 0 ? `Accretive, +${v}%` : `Dilutive, ${v}%`)),
    correctIndex: opts.correctIndex,
    fmt: null
  };
}

// Plain office-arithmetic questions -- no finance jargon required.
function genQ_timeSum() {
  const a = randInt(15, 60), b = randInt(15, 60), c = randInt(15, 60);
  const total = a + b + c;
  const opts = shuffleOptions(total, [total - 15, total + 10, total + 25]);
  return {
    text: `You have three calls today lasting ${a}, ${b}, and ${c} minutes. How much total time is that?`,
    options: opts.options, correctIndex: opts.correctIndex, fmt: v => v + " min"
  };
}

function genQ_budgetSplit() {
  const people = randInt(3, 6);
  const perPerson = randInt(15, 60);
  const total = perPerson * people;
  const opts = shuffleOptions(perPerson, [perPerson - 5, perPerson + 5, perPerson + 10].map(v => Math.max(1, v)));
  return {
    text: `The team orders $${total} of lunch, split evenly ${people} ways. How much does each person owe?`,
    options: opts.options, correctIndex: opts.correctIndex, fmt: v => "$" + v
  };
}

function genQ_emailPace() {
  const emails = randInt(12, 40);
  const perTenMin = randInt(2, 5);
  const minutes = Math.round((emails / perTenMin) * 10);
  const opts = shuffleOptions(minutes, [Math.round(minutes * 0.6), Math.round(minutes * 1.4), Math.round(minutes * 1.7)]);
  return {
    text: `You need to send ${emails} follow-up emails and can do about ${perTenMin} per 10 minutes. Roughly how long will that take?`,
    options: opts.options, correctIndex: opts.correctIndex, fmt: v => v + " min"
  };
}

function shuffleOptions(correctVal, distractors) {
  const vals = [correctVal, ...distractors];
  // Fisher-Yates
  for (let i = vals.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [vals[i], vals[j]] = [vals[j], vals[i]];
  }
  return { options: vals, correctIndex: vals.indexOf(correctVal) };
}

const CRUNCH_EASY_GENERATORS = [genQ_timeSum, genQ_budgetSplit, genQ_emailPace, genQ_growth];
const CRUNCH_HARD_GENERATORS = [genQ_multiple, genQ_wacc, genQ_eps];
const MODEL_CRUNCH_TIMER_SECONDS = 20;

function crunchDifficultyWeights() {
  if (!STATE.employment) return { easy: 0.8, hard: 0.2 }; // MBA study / unemployed practice
  const s = titleSeniorityLabel();
  if (s === "Analyst") return { easy: 0.9, hard: 0.1 };
  if (s === "Associate") return { easy: 0.65, hard: 0.35 };
  return { easy: 0.45, hard: 0.55 }; // VP+
}

function pickCrunchGenerator() {
  const w = crunchDifficultyWeights();
  const pool = Math.random() < w.easy ? CRUNCH_EASY_GENERATORS : CRUNCH_HARD_GENERATORS;
  return pickRandom(pool);
}

/* ---------------- Model Crunch minigame ---------------- */

function launchModelCrunch(title, onDone) {
  const TOTAL = 5;
  let idx = 0, correct = 0, timer = null;
  const startEnergy = STATE.energy;

  function nextQuestion() {
    if (idx >= TOTAL) return finish();
    const gen = pickCrunchGenerator();
    const q = gen();
    let timeLeft = MODEL_CRUNCH_TIMER_SECONDS;
    openModalHTML(`
      <div class="modal-box minigame-box">
        <div class="minigame-header">${title} <span class="minigame-progress">Question ${idx + 1}/${TOTAL}</span></div>
        <div class="minigame-timerbar"><div class="minigame-timerfill" id="mg-timer" style="width:100%"></div></div>
        <div class="minigame-question">${q.text}</div>
        <div class="minigame-options" id="mg-options"></div>
      </div>
    `);
    const optsEl = document.getElementById("mg-options");
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "btn option-btn";
      btn.textContent = q.fmt ? q.fmt(opt) : opt;
      btn.onclick = () => answer(i === q.correctIndex);
      optsEl.appendChild(btn);
    });

    function answer(isCorrect) {
      clearInterval(timer);
      if (isCorrect) correct++;
      idx++;
      setTimeout(nextQuestion, 250);
    }

    timer = setInterval(() => {
      timeLeft -= 0.2;
      const fill = document.getElementById("mg-timer");
      if (fill) fill.style.width = clamp(timeLeft / MODEL_CRUNCH_TIMER_SECONDS * 100, 0, 100) + "%";
      if (timeLeft <= 0) { answer(false); }
    }, 200);
  }

  function finish() {
    clearModal();
    const raw = correct / TOTAL;
    const energyFactor = clamp(0.7 + (startEnergy / STATE.maxEnergy) * 0.5, 0.7, 1.15);
    const disciplineNudge = (STATE.skills.discipline - 50) / 300;
    const score = clamp(raw * energyFactor + disciplineNudge + 0.08, 0, 1);
    spendEnergy(20);
    onDone(score, raw, correct, TOTAL);
  }

  nextQuestion();
}

/* ---------------- All-Nighter Reflex minigame ---------------- */

function launchReflex(title, onDone) {
  const ROUNDS = 5;
  let round = 0;
  let scores = [];
  const startEnergy = STATE.energy;

  function nextRound() {
    if (round >= ROUNDS) return finish();
    round++;
    openModalHTML(`
      <div class="modal-box minigame-box">
        <div class="minigame-header">${title} <span class="minigame-progress">Round ${round}/${ROUNDS}</span></div>
        <div class="minigame-sub">Wait for the box to turn green, then click it as fast as you can. Click too early and it's a whiff.</div>
        <div class="reflex-box waiting" id="reflex-box">Wait...</div>
      </div>
    `);
    const box = document.getElementById("reflex-box");
    let goTime = null;
    let resolved = false;
    const delay = rand(700, 2400);
    const earlyTimer = setTimeout(() => {
      box.classList.remove("waiting");
      box.classList.add("go");
      box.textContent = "CLICK!";
      goTime = performance.now();
    }, delay);

    box.onclick = () => {
      if (resolved) return;
      if (goTime === null) {
        resolved = true;
        clearTimeout(earlyTimer);
        box.classList.add("early");
        box.textContent = "Too early!";
        scores.push(0.2);
        setTimeout(nextRound, 500);
        return;
      }
      resolved = true;
      const rt = performance.now() - goTime;
      let s;
      if (rt <= 350) s = 1.0;
      else if (rt <= 520) s = 0.85;
      else if (rt <= 750) s = 0.68;
      else if (rt <= 1100) s = 0.5;
      else s = 0.35;
      box.textContent = Math.round(rt) + " ms";
      scores.push(s);
      setTimeout(nextRound, 450);
    };
  }

  function finish() {
    clearModal();
    const raw = scores.reduce((a, b) => a + b, 0) / scores.length;
    const energyFactor = clamp(0.7 + (startEnergy / STATE.maxEnergy) * 0.5, 0.7, 1.15);
    const disciplineNudge = (STATE.skills.discipline - 50) / 300;
    const score = clamp(raw * energyFactor + disciplineNudge + 0.08, 0, 1);
    spendEnergy(20);
    onDone(score, raw);
  }

  nextRound();
}

  { text: "A vendor sends a mass email advertising new office chairs.", correct: "ignore" },
  { text: "A first-year analyst has a basic question that's already answered on the team wiki.", correct: "delegate" },
  { text: "A client asks for a quick confirmation on tomorrow's meeting time.", correct: "reply" },
  { text: "You're cc'd on a thread that another team already resolved yesterday.", correct: "ignore" },
  { text: "Your VP wants your read on a deal point before end of day.", correct: "reply" },
  { text: "IT sends a routine password-expiration notice.", correct: "ignore" },
  { text: "A summer intern needs hands-on help with something that's really the associate's job to teach.", correct: "delegate" },

  { key: "ignore", label: "Ignore" }
];
const TRIAGE_TIMER_SECONDS = 12;

function launchInboxTriage(title, onDone) {
  const ROUNDS = 5;
  const pool = TRIAGE_SCENARIOS.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [pool[i], pool[j]] = [pool[j], pool[i]];

  const rounds = pool.slice(0, ROUNDS);
  let idx = 0, correct = 0, timer = null;
  const startEnergy = STATE.energy;

  function nextRound() {
    if (idx >= rounds.length) return finish();
    const scenario = rounds[idx];
    const actions = TRIAGE_ACTIONS.slice();
    for (let i = actions.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [actions[i], actions[j]] = [actions[j], actions[i]];
    }
    let timeLeft = TRIAGE_TIMER_SECONDS;
    openModalHTML(`
      <div class="modal-box minigame-box">
        <div class="minigame-header">${title} <span class="minigame-progress">Item ${idx + 1}/${rounds.length}</span></div>
        <div class="minigame-timerbar"><div class="minigame-timerfill" id="mg-timer" style="width:100%"></div></div>

    actions.forEach(a => {
      const btn = document.createElement("button");
      btn.className = "btn option-btn";
      btn.textContent = a.label;
      btn.onclick = () => answer(a.key === scenario.correct);
      optsEl.appendChild(btn);
    });

    function answer(isCorrect) {
      clearInterval(timer);
      if (isCorrect) correct++;
      idx++;
      setTimeout(nextRound, 250);
    }

    timer = setInterval(() => {
      timeLeft -= 0.2;
      const fill = document.getElementById("mg-timer");
      if (fill) fill.style.width = clamp(timeLeft / TRIAGE_TIMER_SECONDS * 100, 0, 100) + "%";
      if (timeLeft <= 0) answer(false);
    }, 200);
  }

  function finish() {
    clearModal();
    const raw = correct / rounds.length;
    const energyFactor = clamp(0.7 + (startEnergy / STATE.maxEnergy) * 0.5, 0.7, 1.15);
    const disciplineNudge = (STATE.skills.discipline - 50) / 300;
    const score = clamp(raw * energyFactor + disciplineNudge + 0.08, 0, 1);
    spendEnergy(20);
    onDone(score, raw, correct, rounds.length);
  }

  nextRound();
}

/* ---------------- Client Call Sequence minigame (Simon-style memory) ---------------- */

const SEQUENCE_CLIENTS = ["Client A", "Client B", "Client C", "Client D"];

function launchClientSequence(title, onDone) {
  const MAX_ROUNDS = 5;
  const sequence = [];
  let roundsCompleted = 0;
  const startEnergy = STATE.energy;

  function renderBoard(activeIndex, disabled) {
    openModalHTML(`
      <div class="modal-box minigame-box">
        <div class="minigame-header">${title} <span class="minigame-progress">Round ${roundsCompleted + 1}/${MAX_ROUNDS}</span></div>
        <div class="minigame-sub">Watch the order the clients light up, then repeat it back by clicking them in the same order.</div>
        <div class="simon-grid" id="simon-grid">
          ${SEQUENCE_CLIENTS.map((name, i) => `<button class="simon-box${activeIndex === i ? " active" : ""}" data-i="${i}" ${disabled ? "disabled" : ""}>${name}</button>`).join("")}
        </div>
      </div>
    `);
  }

  function playback() {
    renderBoard(-1, true);
    let i = 0;
    const step = () => {
      if (i >= sequence.length) { setTimeout(startInput, 300); return; }
      renderBoard(sequence[i], true);
      setTimeout(() => {
        renderBoard(-1, true);
        setTimeout(() => { i++; step(); }, 200);
      }, 550);
    };
    setTimeout(step, 400);
  }

  function startInput() {
    renderBoard(-1, false);
    let inputIdx = 0;
    const grid = document.getElementById("simon-grid");
    grid.querySelectorAll(".simon-box").forEach(btn => {
      btn.onclick = () => {
        const i = Number(btn.dataset.i);
        if (i === sequence[inputIdx]) {
          btn.classList.add("active");
          setTimeout(() => btn.classList.remove("active"), 200);
          inputIdx++;
          if (inputIdx === sequence.length) {
            roundsCompleted++;
            if (roundsCompleted >= MAX_ROUNDS) { finish(); return; }
            sequence.push(randInt(0, 3));
            setTimeout(playback, 500);
          }
        } else {
          finish();
        }
      };
    });
  }

  function finish() {
    clearModal();
    const raw = roundsCompleted / MAX_ROUNDS;
    const energyFactor = clamp(0.7 + (startEnergy / STATE.maxEnergy) * 0.5, 0.7, 1.15);
    const disciplineNudge = (STATE.skills.discipline - 50) / 300;
    const score = clamp(raw * energyFactor + disciplineNudge + 0.08, 0, 1);
    spendEnergy(20);
    onDone(score, raw);
  }

  sequence.push(randInt(0, 3), randInt(0, 3), randInt(0, 3));
  playback();
}

}

/* ==========================================================================
   INTERVIEW.JS — the interview modal flow for landing a job offer.
   ========================================================================== */

const INTERVIEW = {};

const IV_TIMER_SECONDS = 30;
const IV_QUESTION_COUNT = 4;
const DEFAULT_IV_WEIGHTS = { easy: 0.6, medium: 0.3, hard: 0.1 };
const IV_QUIZ_WEIGHT = 0.6;
const IV_MINIGAME_WEIGHT = 0.4;

function pickInterviewQuestions(weights, count) {
  const byTier = { easy: [], medium: [], hard: [] };
  DATA.INTERVIEW_QUESTIONS.forEach(q => byTier[q.tier || "medium"].push(q));
  Object.keys(byTier).forEach(t => {
    const arr = byTier[t];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  });
  const tiers = ["easy", "medium", "hard"];
  const picks = [];
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let cum = 0, chosen = tiers[0];
    for (const t of tiers) {
      cum += weights[t] || 0;
      if (r <= cum) { chosen = t; break; }
    }
    let q = byTier[chosen].pop();
    if (!q) {
      for (const t2 of tiers) { if (byTier[t2].length) { q = byTier[t2].pop(); break; } }
    }
    if (q) picks.push(q);
  }
  return picks;
}

INTERVIEW.start = function (firmId, track, onDone) {
  const firm = DATA.FIRMS.find(f => f.id === firmId);
  const weights = firm.interviewWeights || DEFAULT_IV_WEIGHTS;
  const questions = pickInterviewQuestions(weights, IV_QUESTION_COUNT);
  let idx = 0, correct = 0;

  function nextQuestion() {
    if (idx >= questions.length) return startMinigamePhase();
    const q = questions[idx];

    // Shuffle option order (and track the new correct index) fresh each time,
    // so the right answer's position isn't a fixed, memorizable spot.
    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [order[i], order[j]] = [order[j], order[i]];
    }
    const shuffledOptions = order.map(i => q.options[i]);
    const shuffledCorrectIndex = order.indexOf(q.correct);

    let timeLeft = IV_TIMER_SECONDS;
    let timer = null;
    openModalHTML(`
      <div class="modal-box interview-box">
        <div class="minigame-header">Interview at ${firm.name} <span class="minigame-progress">Q${idx + 1}/${questions.length}</span></div>
        <div class="minigame-timerbar"><div class="minigame-timerfill" id="iv-timer" style="width:100%"></div></div>
        <div class="minigame-question">${q.q}</div>
        <div class="minigame-options" id="iv-options"></div>
      </div>
    `);
    const optsEl = document.getElementById("iv-options");
    shuffledOptions.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "btn option-btn";
      btn.textContent = opt;
      btn.onclick = () => answer(i === shuffledCorrectIndex);
      optsEl.appendChild(btn);
    });

    function answer(isCorrect) {
      clearInterval(timer);
      if (isCorrect) correct++;
      idx++;
      setTimeout(nextQuestion, 200);
    }

    timer = setInterval(() => {
      timeLeft -= 0.2;
      const fill = document.getElementById("iv-timer");
      if (fill) fill.style.width = clamp(timeLeft / IV_TIMER_SECONDS * 100, 0, 100) + "%";
      if (timeLeft <= 0) answer(false);
    }, 200);
  }

  function startMinigamePhase() {
    const quizScorePct = correct / questions.length;
    openModalHTML(`
      <div class="modal-box minigame-box">
        <div class="minigame-header">One more thing</div>
        <div class="minigame-sub">${firm.name} wants to see how you think on your feet, not just what you know. One quick exercise before they decide.</div>
        <button class="btn btn-primary" id="iv-mg-continue">Continue</button>
      </div>
    `);
    document.getElementById("iv-mg-continue").onclick = () => {
      clearModal();
      const variant = pickRandom(["crunch", "reflex", "triage", "sequence"]);
      const title = `Interview at ${firm.name}`;
      const onMgDone = (mgScore) => finish(quizScorePct, mgScore);
      if (variant === "reflex") launchReflex(title, onMgDone);
      else if (variant === "triage") launchInboxTriage(title, onMgDone);
      else if (variant === "sequence") launchClientSequence(title, onMgDone);
      else launchModelCrunch(title, onMgDone);
    };
  }

  function finish(quizScorePct, mgScore) {
    const scorePct = clamp(quizScorePct * IV_QUIZ_WEIGHT + mgScore * IV_MINIGAME_WEIGHT, 0, 1);
    const result = ENGINE.resolveInterview(firmId, track, scorePct);
    let headline, sub;
    if (result.hired) {
      headline = "You got the offer!";
      sub = `${firm.name} extended you an offer as ${track === "IB" ? currentTitleTrackName() : currentTitleTrackName()}. Score: ${Math.round(scorePct * 100)}/100.`;
    } else {
      headline = "No offer this time.";
      sub = `Score: ${Math.round(scorePct * 100)}/100. Build your network and skills, then try again.`;
    }
    openModalHTML(`
      <div class="modal-box minigame-box">
        <div class="minigame-header">${headline}</div>
        <div class="minigame-sub">${sub}</div>
        <button class="btn btn-primary" id="iv-continue">Continue</button>
      </div>
    `);
    document.getElementById("iv-continue").onclick = () => { clearModal(); onDone(result); };
  }

  nextQuestion();
};

function competitivenessLabel(c) {
  if (c >= 0.8) return "Extremely High";
  if (c >= 0.6) return "High";
  if (c >= 0.35) return "Medium";
  return "Low";
}

UI.firmCardHTML = function (f) {
  const elig = ENGINE.firmEligibility(f.id);
  const isCurrent = STATE.employment && STATE.employment.firmId === f.id;
  const competitiveness = f.competitiveness != null ? f.competitiveness : 0.3;
  return `<div class="card firm-card ${isCurrent ? "current" : ""}">
    <h4>${f.name}</h4>
    <p class="muted">${f.tier} · Competitiveness: ${competitivenessLabel(competitiveness)}</p>
    <p>${f.blurb}</p>
    <p class="muted">Req: Networking ${f.reqNetworking}+, Communication ${f.reqComm}+${f.minIBMonths ? `, ${Math.round(f.minIBMonths / 12 * 10) / 10}+ yrs IB` : ""}</p>

      elig.eligible

        : `<p class="locked">${elig.reasons.join(" ")}</p>`}

};

/* ---------------- Save slots ---------------- */

UI.pendingSlot = null;

UI.showSlotPicker = function (opts) {
  opts = opts || {};
  const forced = !!opts.forced;
  const canCancel = !forced && STATE.characterCreated;
  const cloudUser = (typeof CLOUD !== "undefined" && CLOUD.enabled) ? CLOUD.user : null;
  const cards = [];
  for (let slot = 1; slot <= SAVE_SLOT_COUNT; slot++) {
    const summary = getSlotSummary(slot);
    const isActive = STATE.characterCreated && STATE.activeSlot === slot;
    if (summary) {
      cards.push(`
        <div class="card save-slot ${isActive ? "current" : ""}">
          <h4>Slot ${slot}${isActive ? " — Current" : ""}</h4>
          <p>${summary.name} — Age ${summary.ageYears}y ${summary.ageMonths}m</p>
          <p class="muted">${summary.status}${summary.gameOver ? " · Game Over" : ""}</p>
          <p class="muted">Net worth: ${fmtMoney(summary.netWorth)}</p>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="UI.pickSlotContinue(${slot})">Continue</button>
            <button class="btn" onclick="UI.exportSlot(${slot})">Export Code</button>
            <button class="btn btn-danger" onclick="UI.pickSlotDelete(${slot}, ${forced})">Delete</button>
          </div>
          ${cloudUser ? `<div class="btn-row"><button class="btn" onclick="CLOUD.uploadSlot(${slot})">☁ Upload</button><button class="btn" onclick="CLOUD.downloadSlot(${slot})">☁ Download</button></div>` : ""}
        </div>
      `);
    } else {
      cards.push(`
        <div class="card save-slot">
          <h4>Slot ${slot}</h4>
          <p class="muted">Empty</p>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="UI.pickSlotNew(${slot})">New Game</button>
            ${cloudUser ? `<button class="btn" onclick="CLOUD.downloadSlot(${slot})">☁ Download</button>` : ""}
          </div>
        </div>
      `);
    }
  }
  const cloudRow = typeof CLOUD !== "undefined"
    ? (cloudUser
        ? `<p class="muted">Signed in as ${cloudUser.displayName || cloudUser.email} · <a href="#" id="cloud-signout">Sign out</a></p>`
        : `<button class="btn" id="cloud-signin">Sign in with Google (cloud sync)</button>`)
    : "";
  openModalHTML(`
    <div class="modal-box wide">
      <h2>Choose a Save</h2>
      <p class="muted">You have 5 save slots. Continue one, or start a new career in an empty slot.</p>
      ${cloudRow}
      <div class="grid-2">${cards.join("")}</div>
      <div class="btn-row">
        <button class="btn" id="import-code-btn">Import Code</button>
        ${canCancel ? '<button class="btn" id="slot-cancel">Cancel</button>' : ""}
      </div>
    </div>
  `);
  if (canCancel) el("slot-cancel").onclick = () => { clearModal(); };
  el("import-code-btn").onclick = () => UI.showImportCode(forced);
  if (cloudUser) { const so = el("cloud-signout"); if (so) so.onclick = (e) => { e.preventDefault(); CLOUD.signOut(); }; }
  else { const si = el("cloud-signin"); if (si) si.onclick = () => CLOUD.signIn(); }
};

UI.pickSlotContinue = function (slot) {
  load(slot);
  setActiveSlot(slot);
  clearModal();
  UI.renderAll();
};

UI.pickSlotDelete = function (slot, forced) {
  if (!confirm("Delete this save? This can't be undone.")) return;
  if (STATE.activeSlot === slot) STATE.characterCreated = false;
  deleteSlot(slot);
  UI.showSlotPicker({ forced: forced || !STATE.characterCreated });
};

UI.pickSlotNew = function (slot) {
  UI.pendingSlot = slot;
  UI.showCharacterCreation();
};

/* ---------------- Export / Import save codes ---------------- */

function encodeSaveCode(rawJsonString) {
  return btoa(unescape(encodeURIComponent(rawJsonString)));
}

function decodeSaveCode(code) {
  return decodeURIComponent(escape(atob(code.trim())));
}

UI.exportSlot = function (slot) {
  const raw = localStorage.getItem(slotKey(slot));
  if (!raw) return;
  const code = encodeSaveCode(raw);
  openModalHTML(`
    <div class="modal-box">
      <h2>Your Save Code</h2>
      <p class="muted">Copy this code, then use "Import Code" on another device or browser to bring this save over.</p>
      <textarea id="export-code" class="num-input" style="width:100%;height:140px;" readonly>${code}</textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="export-copy">Copy Code</button>
        <button class="btn" id="export-back">Back</button>
      </div>
    </div>
  `);
  el("export-copy").onclick = () => {
    const ta = el("export-code");
    ta.select();
    let copied = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(() => UI.toast("Copied!")).catch(() => { document.execCommand("copy"); UI.toast("Copied!"); });
      copied = true;
    }
    if (!copied) { document.execCommand("copy"); UI.toast("Copied!"); }
  };
  el("export-back").onclick = () => UI.showSlotPicker({ forced: !STATE.characterCreated });
};

UI.showImportCode = function (forced) {
  openModalHTML(`
    <div class="modal-box">
      <h2>Import a Save Code</h2>
      <p class="muted">Paste a code exported from another device, then choose which slot to load it into.</p>
      <textarea id="import-code" class="num-input" style="width:100%;height:140px;" placeholder="Paste code here"></textarea>
      <label class="field-label">Import into slot</label>
      <select id="import-slot" class="num-input">
        ${[1, 2, 3, 4, 5].map(s => `<option value="${s}">Slot ${s}${hasSaveInSlot(s) ? " (occupied — will overwrite)" : " (empty)"}</option>`).join("")}
      </select>
      <div class="btn-row">
        <button class="btn btn-primary" id="import-go">Import</button>
        <button class="btn" id="import-back">Back</button>
      </div>
    </div>
  `);
  el("import-go").onclick = () => {
    const code = el("import-code").value.trim();
    const slot = Number(el("import-slot").value);
    if (!code) { UI.toast("Paste a code first.", true); return; }
    let parsed;
    try {
      parsed = JSON.parse(decodeSaveCode(code));
    } catch (e) {
      UI.toast("That code looks invalid.", true);
      return;
    }
    if (!parsed || typeof parsed !== "object" || !parsed.name) {
      UI.toast("That code looks invalid.", true);
      return;
    }
    if (hasSaveInSlot(slot) && !confirm(`This will overwrite the existing save in Slot ${slot}. Continue?`)) return;
    localStorage.setItem(slotKey(slot), JSON.stringify(parsed));
    UI.toast(`Imported into Slot ${slot}!`);
    UI.showSlotPicker({ forced: forced || !STATE.characterCreated });
  };
  el("import-back").onclick = () => UI.showSlotPicker({ forced: forced || !STATE.characterCreated });
};

/* ---------------- Character creation ---------------- */

UI.showCharacterCreation = function () {
  let chosenMode = (window.matchMedia && window.matchMedia("(max-width: 700px)").matches) ? "mobile" : "desktop";
  openModalHTML(`
    <div class="modal-box">
      <h2>Welcome to Wall Street</h2>
      <p>You're 22, fresh out of college with a finance degree — and $450,000 in student debt. No job. No apartment. Just ambition.</p>
      <p>Your goal: become the greatest investment banker who ever lived.</p>
      <label class="field-label">Your name</label>
      <input type="text" id="char-name" class="num-input" placeholder="Alex Ward" value="Alex Ward">
      <label class="field-label">Choose your layout</label>
      <div class="layout-choice">
        <button class="layout-btn" id="mode-desktop" data-mode="desktop">🖥️ Desktop</button>
        <button class="layout-btn" id="mode-mobile" data-mode="mobile">📱 Mobile</button>
      </div>
      <p class="muted">You can switch anytime from the icon in the header.</p>
      <button class="btn btn-primary" id="char-start">Begin Your Career</button>
    </div>
  `);
  const modeButtons = [el("mode-desktop"), el("mode-mobile")];
  function refreshModeButtons() {
    modeButtons.forEach(b => b.classList.toggle("active", b.dataset.mode === chosenMode));
  }
  modeButtons.forEach(b => { b.onclick = () => { chosenMode = b.dataset.mode; refreshModeButtons(); }; });
  refreshModeButtons();

  el("char-start").onclick = () => {
    const name = el("char-name").value.trim() || "Alex Ward";
    const slot = UI.pendingSlot || STATE.activeSlot || 1;
    newGame(name, slot);
    setActiveSlot(slot);
    STATE.characterCreated = true;
    STATE.uiMode = chosenMode;
    UI.pendingSlot = null;
    save();
    UI.renderAll();
  };
};

/* ---- js/cloud-sync.js ---- */
/* ==========================================================================
   CLOUD-SYNC.JS — optional Google sign-in + cross-device cloud sync.

   This is OFF by default and totally inert until you set it up. To enable it:

   1. Go to https://console.firebase.google.com and create a free project
      (any Google account works).
   2. In your project: Build > Authentication > Sign-in method > enable
      "Google" as a provider.
   3. In your project: Build > Firestore Database > Create database
      (production mode is fine; the default security rules that only allow
      a signed-in user to read/write their own /users/{uid}/** documents
      work with this file as-is).
   4. Project settings (gear icon) > General > "Your apps" > add a Web app.
      Copy the firebaseConfig object it gives you.
   5. Paste that object as FIREBASE_CONFIG below, replacing `null`.
   6. If you're hosting on GitHub Pages, add that domain (e.g.
      yourname.github.io) under Authentication > Settings > Authorized
      domains, or Google sign-in will be rejected.

   This only works when the page can reach the internet and load Google's
   SDK from a CDN — it will not work inside the sandboxed Claude Artifact
   viewer (its content-security-policy blocks outside connections), only
   on a normally-hosted copy of this page (e.g. GitHub Pages). If it isn't
   configured, or the SDK can't load, every function below quietly no-ops
   with a toast instead of erroring.
   ========================================================================== */

const FIREBASE_CONFIG = null; // <-- paste your Firebase config object here

const CLOUD = { enabled: false, user: null };

(function initCloud() {
  if (!FIREBASE_CONFIG) return;
  const version = "10.7.1";
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  loadScript(`https://www.gstatic.com/firebasejs/${version}/firebase-app-compat.js`)
    .then(() => loadScript(`https://www.gstatic.com/firebasejs/${version}/firebase-auth-compat.js`))
    .then(() => loadScript(`https://www.gstatic.com/firebasejs/${version}/firebase-firestore-compat.js`))
    .then(() => {
      firebase.initializeApp(FIREBASE_CONFIG);
      CLOUD.enabled = true;
      firebase.auth().onAuthStateChanged(user => {
        CLOUD.user = user;
      });
    })
    .catch(() => { CLOUD.enabled = false; });
})();

CLOUD.signIn = function () {
  if (!CLOUD.enabled) { UI.toast("Cloud sync isn't set up yet.", true); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider)
    .then(() => {
      UI.toast("Signed in as " + firebase.auth().currentUser.displayName);
      UI.showSlotPicker({ forced: !STATE.characterCreated });
    })
    .catch(e => UI.toast("Sign-in failed: " + e.message, true));
};

CLOUD.signOut = function () {
  if (!CLOUD.enabled) return;
  firebase.auth().signOut().then(() => {
    UI.toast("Signed out.");
    UI.showSlotPicker({ forced: !STATE.characterCreated });
  });
};

CLOUD.uploadSlot = function (slot) {
  if (!CLOUD.enabled || !CLOUD.user) { UI.toast("Sign in with Google first.", true); return; }
  const raw = localStorage.getItem(slotKey(slot));
  if (!raw) { UI.toast("Nothing to upload in that slot.", true); return; }
  firebase.firestore().collection("users").doc(CLOUD.user.uid).collection("saves").doc(String(slot))
    .set({ data: raw, updatedAt: Date.now() })
    .then(() => UI.toast(`Uploaded Slot ${slot} to the cloud.`))
    .catch(e => UI.toast("Upload failed: " + e.message, true));
};

CLOUD.downloadSlot = function (slot) {
  if (!CLOUD.enabled || !CLOUD.user) { UI.toast("Sign in with Google first.", true); return; }
  firebase.firestore().collection("users").doc(CLOUD.user.uid).collection("saves").doc(String(slot)).get()
    .then(doc => {
      if (!doc.exists) { UI.toast("No cloud save for that slot yet.", true); return; }
      localStorage.setItem(slotKey(slot), doc.data().data);
      UI.toast(`Downloaded Slot ${slot} from the cloud.`);
      UI.showSlotPicker({ forced: !STATE.characterCreated });
    })
    .catch(e => UI.toast("Download failed: " + e.message, true));
};


/* ---- js/main.js ---- */
/* ==========================================================================
   MAIN.JS — boot sequence.
   ========================================================================== */

(function boot() {
  migrateLegacySave();

  const activeSlot = getActiveSlot();
  if (activeSlot && hasSaveInSlot(activeSlot) && load(activeSlot)) {
    UI.renderAll();
  } else {
    UI.showSlotPicker({ forced: true });
  }

  window.addEventListener("beforeunload", () => { if (STATE.activeSlot) save(); });

  // Expose a manual reset for convenience in dev tools.
  window.resetGame = function () { wipeSave(); location.reload(); };
})();

  </script>
